    this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    if (W.solidAt(this.x, this.y)) { this.dead = true; W.particles.burst(this.x, this.y, 5, { col: this.col, max: 50 }); return; }
    if (this.owner === 'player') {
      for (const e of W.entities) {
        if (e.dead) continue;
        if (this.x > e.x && this.x < e.x + e.w && this.y > e.y - 2 && this.y < e.y + e.h + 2) {
          if (e.enemy) { e.hit(W, this.dmg, this.x - this.vx * 0.02, 'ping'); this.dead = true; W.particles.burst(this.x, this.y, 6, { col: PAL.cyan, max: 60 }); return; }
          if (e.onPing) { e.onPing(W); this.dead = true; return; }

      const p = W.player;
      if (p.shieldT > 0 && dist(this.x, this.y, p.cx, p.y + 8) < 18) { this.frozen = 0.5; this.vx = 0; this.vy = 0; AudioSys.play('tick'); if (this.src && this.src.interrupt) this.src.interrupt(W); return; }
      if (this.x > p.x && this.x < p.x + p.w && this.y > p.y && this.y < p.y + p.h) { p.hurt(W, this.dmg, this.x - this.vx); this.dead = true; }
    }
  }
  render(g) {
    const x = Math.round(this.x), y = Math.round(this.y);
    if (this.owner === 'player') { g.fillStyle = PAL.white; g.fillRect(x - 2, y - 1, 4, 2); g.fillStyle = this.col; g.fillRect(x - 5 * sign(this.vx), y, 3, 1); }

  }
}
class Fx {

}

  npc: NPC, lever: Lever, plate: Plate, platform: MovingPlatform, block: Block, socket: Socket, linknode: LinkNode, busnode: BusNode,
  bridge: BridgeZone, fan: Fan, marker: Marker, trigger: Trigger, heat: HeatZone, collapse: CollapseZone, screen: Screen, deco: Deco,
  bitcorrupt: BitCorrupt, drone: Drone, cachemiss: CacheMissEnemy, buserror: BusErrorEnemy, overheat: OverHeatEnemy,
  deadlock: DeadlockEnemy, nullpointer: NullPointerEnemy, packetstorm: PacketStormEnemy
};
function makeEntity(type, cx, cy, p, W) {
  const C = ENTITY_TYPES[type];
  if (!C) { console.warn('Tipo de entidad desconocido:', type); return null; }
  return new C(cx, cy, p, W);
}

const SPEAKERS = {
  BYTE: { name: 'BYTE', col: PAL.cyan, pitch: 560 },
  NEXO: { name: 'NEXO', col: PAL.green, pitch: 780 },
  NULL: { name: 'N.U.L.L.', col: PAL.violet, pitch: 170 },
  NEXUS: { name: 'NEXUS', col: PAL.gold, pitch: 440 },
  SYS: { name: 'SISTEMA', col: PAL.grayL, pitch: 980 },
  TERMINAL: { name: 'TERMINAL', col: PAL.grayL, pitch: 980, portrait: 'SYS' },
  LOG: { name: 'REGISTRO', col: PAL.amber, pitch: 300 },
  VOZ: { name: 'VOZ GRABADA — BYTE', col: PAL.amber, pitch: 240, portrait: 'LOG' },
  ARCHIVO: { name: 'ARCHIVO', col: '#C8B890', pitch: 260 },
  REG: { name: 'REG', col: PAL.amber, pitch: 1100 },
  CACHE: { name: 'CACHE', col: '#8FB3DE', pitch: 620 },
  BUS: { name: 'BUS', col: PAL.cyan, pitch: 500 },
  IO: { name: 'IO', col: PAL.violet, pitch: 700 },
  VOLT: { name: 'VOLT', col: PAL.gold, pitch: 380 },
  CASCADE: { name: 'CASCADE', col: PAL.red, pitch: 90 },
  '': { name: '', col: PAL.grayL, pitch: 0 }
};
function normLine(L) {
  if (Array.isArray(L)) { const o = Object.assign({}, L[3] || {}); o.s = L[0]; o.t = L[1]; if (L[2]) o.e = L[2]; return o; }
  return Object.assign({}, L);
}

class DialogueState {
  constructor(lines, o = {}) {
    this.overlay = true; this.updateBelow = true;
    this.lines = lines.map(normLine); this.o = o; this.W = o.world;
    this.i = 0; this.result = -1; this.t = 0;
    this.seen = o.id && PROG && PROG.seenDialogues.includes(o.id);
    this.start();
  }
  start() {
    const L = this.lines[this.i];
    this.L = L; this.chars = 0; this.blipC = 0;
    L.t = Font.norm(L.t || '');
    this.full = Font.count(L.t);
    const noPortrait = L.s === '' || L.s === '*';
    this.wrapped = UI.wrap(L.t, noPortrait ? 440 : 372);
    this.pause = L.p || 0; this.choiceSel = 0;
    const W = this.W;
    if (W) {
      if (L.fx === 'shake') W.shake(L.mag || 4, 0.4);
      if (L.fx === 'glitch') W.glitch(0.5, L.gk || 'null');
      if (L.fx === 'flash') W.flash(L.fcol || '#FFFFFF', 0.4);
      if (L.s === 'NEXO' && L.e) W.nexo.emote(L.e, L.ep ? 0 : 6);
    }
    if (L.sfx) AudioSys.play(L.sfx, L.cap ? { caption: L.cap } : {});
    else if (L.cap) UI.caption(L.cap);
    if (L.flag) PROG.flags[L.flag] = true;
    if (L.do) L.do(W);
    if (Settings.data.textSpeed === 3) this.chars = this.full;
  }
  enter() {}
  update(dt) {
    this.t += dt;
    const L = this.L;
    if (this.seen && Input.pressed('skip')) { this.skipAll(); return; }
    if (this.pause > 0) { this.pause -= dt; if (Input.pressed('confirm')) this.pause = 0; return; }
    if (this.chars < this.full) {
      const before = Math.floor(this.chars);
      this.chars = Math.min(this.full, this.chars + Settings.textCps * (L.sp || 1) * dt);
      if (Math.floor(this.chars) !== before) {
        this.blipC++;
        const spk = SPEAKERS[L.s] || SPEAKERS.SYS;
        if (spk.pitch && this.blipC % 2 === 0) AudioSys.play('blip', { f: spk.pitch + randi(-30, 30) });
      }
      if (Input.pressed('confirm') || UI.clicked(0, H - 90, W, 90)) this.chars = this.full;
      return;
    }
    if (L.ch) {
      if (Input.nav('up')) { this.choiceSel = (this.choiceSel + L.ch.length - 1) % L.ch.length; AudioSys.play('ui_move'); }
      if (Input.nav('down')) { this.choiceSel = (this.choiceSel + 1) % L.ch.length; AudioSys.play('ui_move'); }
      const r = this.choiceRects && this.choiceRects.findIndex(b => UI.clicked(b.x, b.y, b.w, b.h));
      if (r != null && r >= 0) { this.choiceSel = r; this.choose(); return; }
      if (Input.pressed('confirm')) this.choose();
      return;
    }
    if (L.auto != null) { this.autoT = (this.autoT || 0) + dt; if (this.autoT > L.auto) { this.autoT = 0; this.next(); } return; }
    if (Input.pressed('confirm') || UI.clicked(0, H - 90, W, 90)) { AudioSys.play('ui_move'); this.next(); }
  }
  choose() { this.result = this.choiceSel; AudioSys.play('ui_ok'); if (this.L.onChoose) this.L.onChoose(this.choiceSel, this.W); this.next(); }
  skipAll() {
    for (let k = this.i; k < this.lines.length; k++) {
      const L = this.lines[k];
      if (L.flag) PROG.flags[L.flag] = true;
      if (L.ch) { this.i = k; this.start(); this.chars = this.full; this.pause = 0; return; }
    }
    this.finish();
  }
  next() { this.i++; if (this.i >= this.lines.length) this.finish(); else this.start(); }
  finish() {
    if (Game.top() === this) Game.pop();
    if (this.o.id && PROG && !PROG.seenDialogues.includes(this.o.id)) PROG.seenDialogues.push(this.o.id);
    if (this.o.onDone) this.o.onDone(this.result);
  }
  render(g) {
    const L = this.L;
    const spk = SPEAKERS[L.s] || { name: L.s, col: PAL.white };
    const bx = 6, by = H - 80, bw = W - 12, bh = 74;
    const narr = L.s === '' || L.s === '*';
    UI.panel(g, bx, by, bw, bh, { fill: 'rgba(8,16,24,0.96)', border: narr ? PAL.grayD : shade(spk.col, 0.8) });
    let tx = bx + 10;
    if (!narr) {
      const pid = spk.portrait || L.s;
      const emo = L.e || (L.s === 'NEXO' ? 'NEUTRAL' : undefined);
      g.fillStyle = '#000'; g.fillRect(bx + 6, by + 6, 68, 62);
      const img = getPortrait(pid, emo);
      let px = bx + 8, py = by + 5;
      if (L.s === 'NULL' && Math.random() < 0.12) px += randi(-2, 2);
      g.drawImage(img, px, py, 64, 64);
      if (L.s === 'NULL' || L.gl) { g.fillStyle = 'rgba(170,125,255,0.12)'; g.fillRect(px, py + (Math.floor(this.t * 60) % 64), 64, 2); }
      tx = bx + 84;
      const nw = Font.measure(spk.name) + 10;
      g.fillStyle = shade(spk.col, 0.35); g.fillRect(tx - 2, by - 7, nw, 12);
      g.fillStyle = spk.col; g.fillRect(tx - 2, by + 4, nw, 1);
      Font.draw(g, spk.name, tx + 3, by - 8, spk.col);
    }
    if (this.pause > 0) {
      Font.draw(g, '.'.repeat(1 + Math.floor(this.t * 3) % 3), tx, by + 10, PAL.gray);
    } else {
      Font.drawLines(g, this.wrapped.slice(0, 5), tx, by + 8, narr ? PAL.grayL : PAL.white, { max: Math.floor(this.chars), hl: spk.col === PAL.white ? PAL.amber : PAL.amber });
    }
    if (this.chars >= this.full && this.pause <= 0 && !L.ch && L.auto == null) {
      const b = Math.floor(this.t * 3) % 2;
      Font.draw(g, '▼', bx + bw - 12, by + bh - 13 + b, spk.col || PAL.white);
    }
    if (this.seen) Font.draw(g, '[TAB] omitir', bx + bw - 8, by + 3, PAL.grayD, { align: 'right' });
    if (L.ch && this.chars >= this.full && this.pause <= 0) {
      const cw = Math.max(...L.ch.map(c => Font.measure(c))) + 30;
      const ch = L.ch.length * 16 + 10;
      const cx = W - cw - 12, cy = by - ch - 12;
      UI.panel(g, cx, cy, cw, ch, { border: PAL.cyan });
      this.choiceRects = [];
      L.ch.forEach((c, k) => {
        const yy = cy + 5 + k * 16;
        const foc = k === this.choiceSel;
        if (foc) { g.fillStyle = '#15384A'; g.fillRect(cx + 3, yy, cw - 6, 15); Font.draw(g, '▶', cx + 6, yy + 1, PAL.cyan); }
        Font.draw(g, c, cx + 18, yy + 1, foc ? PAL.white : PAL.grayL);
        this.choiceRects.push({ x: cx, y: yy, w: cw, h: 15 });
      });
    }
  }
}

// Selector compacto para habilidades (Circuit Link, Bus Bridge, BusError...)
class ChoicePromptState {
  constructor(title, options, o = {}) {
    this.overlay = true; this.updateBelow = false;
    this.title = title; this.options = options; this.o = o; this.sel = 0; this.t = 0;
    this.lines = UI.wrap(title, 380);
  }
  update(dt) {
    this.t += dt;
    const n = this.options.length;
    if (Input.nav('up')) { this.sel = (this.sel + n - 1) % n; AudioSys.play('ui_move'); }
    if (Input.nav('down')) { this.sel = (this.sel + 1) % n; AudioSys.play('ui_move'); }
    const r = this.rects && this.rects.findIndex(b => UI.clicked(b.x, b.y, b.w, b.h));
    if (r != null && r >= 0) { this.sel = r; this.done(r); return; }
    if (Input.pressed('confirm')) { this.done(this.sel); return; }
    if (Input.pressed('cancel')) this.done(-1);
  }
  done(i) { AudioSys.play(i >= 0 ? 'ui_ok' : 'ui_back'); if (Game.top() === this) Game.pop(); if (this.o.onDone) this.o.onDone(i); }
  render(g) {
    UI.overlayDim(g, 0.5);
    const col = this.o.col || PAL.cyan;
    const h = 30 + this.lines.length * 12 + this.options.length * 16 + (this.o.sub ? 12 : 0);
    const x = 40, y = Math.floor((H - h) / 2), w = 400;
    UI.panel(g, x, y, w, h, { border: col, title: 'HABILIDAD', titleCol: col });
    Font.drawLines(g, this.lines, x + 10, y + 8, PAL.white, { hl: col });
    let yy = y + 10 + this.lines.length * 12;
    if (this.o.sub) { Font.draw(g, this.o.sub, x + 10, yy, PAL.gray); yy += 12; }
    this.rects = [];
    this.options.forEach((op, i) => {
      const foc = i === this.sel;
      g.fillStyle = foc ? shade(col, 0.3) : '#0D1C26'; g.fillRect(x + 8, yy, w - 16, 14);
      if (foc) { g.fillStyle = col; g.fillRect(x + 8, yy, 2, 14); }
      Font.draw(g, op, x + 16, yy + 1, foc ? PAL.white : PAL.grayL);
      this.rects.push({ x: x + 8, y: yy, w: w - 16, h: 14 });
      yy += 16;
    });
    UI.keyHints(g, [['↑↓', 'Elegir'], ['E', 'Confirmar'], ['ESC', 'Cancelar']], W / 2, y + h + 4, 'center');
  }
}

// Lector de registros, memorias y archivos
class ReaderState {
  constructor(title, text, o = {}) {
    this.overlay = true; this.updateBelow = false; this.title = title; this.o = o; this.t = 0; this.chars = 0; this.scroll = 0;
    this.lines = UI.wrap(Font.norm(text), 420);
    this.full = this.lines.reduce((s, l) => s + Font.count(l), 0);
    const st = o.style || 'log';
    this.col = st === 'memory' ? PAL.gold : st === 'archive' ? '#C8B890' : st === 'null' ? PAL.magenta : st === 'voice' ? PAL.amber : PAL.cyan;
    this.textCol = st === 'memory' ? '#FFF1D0' : st === 'archive' ? '#E8DDB8' : st === 'null' ? '#F0D6F5' : PAL.white;
    if (st === 'memory') AudioSys.play('echo');
  }
  update(dt) {
    this.t += dt;
    this.chars = Math.min(this.full, this.chars + Settings.textCps * 2.5 * dt);
    const maxVis = 12;
    if (this.lines.length > maxVis) {
      if (Input.nav('down')) this.scroll = Math.min(this.lines.length - maxVis, this.scroll + 1);
      if (Input.nav('up')) this.scroll = Math.max(0, this.scroll - 1);
    }
    if (Input.pressed('confirm') || Input.pressed('cancel') || UI.clicked(0, 0, W, H)) {
      if (this.chars < this.full) { this.chars = this.full; return; }
      if (this.lines.length > maxVis && this.scroll < this.lines.length - maxVis && !Input.pressed('cancel')) { this.scroll = this.lines.length - maxVis; return; }
      AudioSys.play('ui_back');
      if (Game.top() === this) Game.pop();
      if (this.o.onDone) this.o.onDone();
    }
  }
  render(g) {
    UI.overlayDim(g, 0.7);
    const maxVis = 12;
    const vis = this.lines.slice(this.scroll, this.scroll + maxVis);
    const h = 40 + vis.length * 12;
    const y = Math.floor((H - h) / 2);
    UI.panel(g, 20, y, 440, h, { border: this.col, title: this.title, titleCol: this.col, fill: this.o.style === 'memory' ? '#1A1408' : this.o.style === 'archive' ? '#14120A' : undefined });
    if (this.o.style === 'memory') { g.fillStyle = 'rgba(241,180,92,0.06)'; for (let yy = y + 4; yy < y + h - 4; yy += 3) g.fillRect(24, yy, 432, 1); }
    let before = this.lines.slice(0, this.scroll).reduce((s, l) => s + Font.count(l), 0);
    Font.drawLines(g, vis, 30, y + 12, this.textCol, { max: Math.max(0, Math.floor(this.chars) - before), hl: this.col });
    if (this.lines.length > maxVis) Font.draw(g, (this.scroll + 1) + '-' + Math.min(this.lines.length, this.scroll + maxVis) + '/' + this.lines.length, 452, y + h - 13, PAL.gray, { align: 'right' });
    if (this.chars >= this.full) Font.draw(g, '[E] cerrar', 452, y + 3, PAL.grayD, { align: 'right' });
  }
}

// =============================================================================
// MÁQUINA DE ESTADOS + MENÚS
// Estados: BOOT, TITLE/MAIN_MENU, INTRO, GAMEPLAY, DIALOGUE, TUTORIAL (avisos), QUESTION,
// MINIGAME, BLUEPRINT, CODEX, PAUSE, BOSS, LEVEL_COMPLETE, GAME_OVER, ENDING, CREDITS
// =============================================================================
const Game = {
  stack: [], time: 0, lowFx: false, canvas: null, g: null, world: null,
  push(s) { this.stack.push(s); if (s.enter) s.enter(); },
  pop() { const s = this.stack.pop(); if (s && s.exit) s.exit(); return s; },
  top() { return this.stack[this.stack.length - 1]; },
  replace(s) { while (this.stack.length) this.pop(); this.push(s); },
  update(dt) {
    this.time += dt;
    UI.update(dt);
    const n = this.stack.length;
    if (!n) return;
    const list = [this.stack[n - 1]];
    let i = n - 1;
    while (i > 0 && this.stack[i].updateBelow) { i--; list.push(this.stack[i]); }
    for (let k = list.length - 1; k >= 0; k--) {
      const s = list[k];
      if (this.stack.includes(s)) s.update(dt, k === 0);
    }
  },
  render() {
    const g = this.g;
    g.fillStyle = PAL.bg; g.fillRect(0, 0, W, H);
    let j = this.stack.length - 1;
    while (j > 0 && this.stack[j].overlay) j--;
    for (let k = Math.max(0, j); k < this.stack.length; k++) this.stack[k].render(g);
    UI.drawToasts(g);
    UI.drawCaptions(g);
    if (Settings.data.scanlines && !Settings.data.contrast && !this.lowFx) g.drawImage(this.scan, 0, 0);
    if (Settings.data.showFps) Font.draw(g, Math.round(Perf.fps) + ' FPS', W - 4, H - 12, PAL.green, { align: 'right' });
  },
  // ---------- flujo de partida ----------
  newGame() {
    PROG = newProgress();
    Sprites.buildByte(0);
    this.replace(new IntroState());
  },
  continueGame() {
    const d = SaveManager.load();
    if (!d) { this.newGame(); return; }
    PROG = d;
    Sprites.buildByte(Progression.upgFor(PROG.playerLevel));
    const lvl = PROG.level || 0;
    this.loadLevel(lvl, { fromCheckpoint: true });
  },
  loadLevel(n, o = {}) {
    if (n >= LEVELS.length) { this.replace(new EndingState()); return; }
    const def = LEVELS[n];
    if (def.special) { this.replace(def.special()); return; }
    PROG.level = n;
    if (!o.fromCheckpoint || !PROG.checkpoint || PROG.checkpoint.level !== n) { if (PROG.checkpoint && PROG.checkpoint.level !== n) PROG.checkpoint = null; }
    const w = new World(def, o);
    this.world = w;
    this.replace(new GameplayState(w));
    AudioSys.playMusic(def.musicFn ? def.musicFn() : def.music);
    this.save();
    UI.toast(def.name, PAL.cyan);
  },
  save() { if (PROG) SaveManager.save(PROG); },
  completeLevel(W) {
    const def = W.def;
    PROG.stats.levelTimes[def.id] = Math.round(W.levelTime);
    PROG.flags['L' + def.id + '_done'] = true;
    if (!W.damageTaken) Achievements.unlock('nodmg');
    if (def.id === 0) Achievements.unlock('boot');
    PROG.checkpoint = null;
    this.push(new LevelCompleteState(W));
  },
  playerDied(W) {
    PROG.stats.deaths++;
    W.run(function* () { yield 0.8; Game.push(new GameOverState(W)); }, 'death');
  }
};
const Perf = { fps: 60, acc: 0, frames: 0, slow: 0,
  tick(dt) {
    this.acc += dt; this.frames++;
    if (this.acc >= 0.5) { this.fps = this.frames / this.acc; this.acc = 0; this.frames = 0;
      if (this.fps < 40) this.slow++; else this.slow = Math.max(0, this.slow - 1);
      if (this.slow >= 6 && !Game.lowFx) { Game.lowFx = true; console.info('Modo de rendimiento reducido activado'); }
    }
  } };

// ---------------------------------------------------------------- GAMEPLAY + HUD ----
class GameplayState {
  constructor(w) { this.W = w; w.state = this; this.hintArrow = null; }
  enter() { Input.touchGameplay = true; }
  exit() { Input.touchGameplay = false; }
  update(dt, top) {
    const W = this.W;
    W.update(dt, top);
    if (this.hintArrow) { this.hintArrow.t -= dt; if (this.hintArrow.t <= 0) this.hintArrow = null; }
    if (!top || W.player.dead) return;
    if (Input.pressed('pause')) { AudioSys.play('ui_ok'); Game.push(new PauseState(this)); }
    else if (Input.pressed('blueprint')) { AudioSys.play('ui_ok'); Game.push(new BlueprintState()); }
    else if (Input.pressed('codex')) { AudioSys.play('ui_ok'); Game.push(new CodexState()); }
    else if (Input.pressed('quests')) { AudioSys.play('ui_ok'); Game.push(new QuestLogState()); }
    else if (Input.pressed('hint') && !W.scripts.blocking) this.worldHint();
  }
  worldHint() {
    const W = this.W;
    const h = W.def.hint ? W.def.hint(W) : null;
    const spk = Voice.speaker();
    const text = h ? h.text : 'Explora: busca terminales con «!» y sigue la misión actual (L).';
    if (spk === 'TERMINAL') W.bark('SYS', 'AYUDA: ' + text, null, 5);
    else W.bark(spk, (spk === 'NEXO' && PROG.flags.nexoReturned ? 'Hipótesis: ' : '') + text, 'CURIOUS', 5);
    if (h && h.x != null) this.hintArrow = { x: h.x, y: h.y, t: 5 };
    AudioSys.play('echo');
  }
  render(g) { this.W.render(g); drawHUD(g, this.W, this); }
}
function drawAbilityIcon(g, k, x, y, sel) {
  const a = ABILITIES[k];
  g.fillStyle = sel ? shade(a.col, 0.45) : '#0D1C26'; g.fillRect(x, y, 14, 14);
  g.fillStyle = a.col; g.fillRect(x, y, 14, 1); g.fillRect(x, y + 13, 14, 1);
  const ic = { circuitLink: '↔', fetchDash: '»', aluPulse: 'O', cacheBoost: '↑', busBridge: '=', interruptShield: '■', parallelClone: '×', registerRecall: 'R' }[k] || '?';
  Font.draw(g, ic, x + 7, y + 1, sel ? PAL.white : a.col, { align: 'center' });
}
function drawHUD(g, W, st) {
  const p = W.player;
  // panel de estado (arriba izquierda)
  g.fillStyle = 'rgba(5,9,13,0.72)'; g.fillRect(4, 4, 132, 34);
  g.fillStyle = PAL.panelB; g.fillRect(4, 38, 132, 1);
  for (let i = 0; i < PROG.maxHp; i++) Font.draw(g, '♥', 8 + i * 9, 5, i < p.hp ? PAL.red : '#3A1A20');
  if (Settings.data.assist) Font.draw(g, 'ASIST.', 132, 5, PAL.gray, { align: 'right' });
  Font.draw(g, 'EN', 8, 15, PAL.cyan);
  UI.bar(g, 22, 19, 108, 4, p.energy / Progression.maxEnergy(), PAL.cyan);
  const lv = PROG.playerLevel, a0 = Progression.prevAt(lv), a1 = Progression.nextAt(lv);
  Font.draw(g, 'NV' + lv, 8, 25, PAL.green);
  UI.bar(g, 30, 29, 100, 3, (PROG.xp - a0) / Math.max(1, a1 - a0), PAL.green);
  // habilidad (arriba derecha)
  const k = PROG.abilities[PROG.selAbility];
  g.fillStyle = 'rgba(5,9,13,0.72)'; g.fillRect(W_HUD_R - 150, 4, 146, 22);
  if (k) {
    const a = ABILITIES[k];
    drawAbilityIcon(g, k, W_HUD_R - 146, 8, true);
    Font.draw(g, a.n, W_HUD_R - 128, 5, a.col);
    Font.draw(g, '[' + Input.label('ability') + '] ' + a.cost + ' EN', W_HUD_R - 128, 14, p.energy >= a.cost ? PAL.grayL : PAL.red);
    const cd = p.cds[k] || 0;
    if (cd > 0) { g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(W_HUD_R - 146, 8, 14, Math.round(14 * cd / a.cd)); }
    PROG.abilities.forEach((kk, i) => { g.fillStyle = i === PROG.selAbility ? ABILITIES[kk].col : PAL.grayD; g.fillRect(W_HUD_R - 50 + i * 5, 20, 4, 3); });

class BlueprintState {
  constructor() {
    this.overlay = true; this.t = 0;
    this.tabs = BP_TABS.filter(t => PROG.bpTabs.includes(t.id));
    this.tab = this.tabs.length - 1; this.sel = null; this.packets = [];
    this.pickDefault();
  }
  nodes() { return BP_TAB_NODES[this.tabs[this.tab].id]; }
  known(id) { const tb = this.tabs[this.tab].id; return tb === 'evt' ? PROG.flags.learnedSystemUpdate || PROG.blueprint.includes(id) : PROG.blueprint.includes(id); }
  pickDefault() { const ns = this.nodes(); this.sel = ns.find(n => this.known(n) && !BP_NODES[n].group) || ns[0]; }
  pos(id) { const n = BP_NODES[id]; return { x: 16 + n.x, y: 32 + n.y, w: n.w || (id.startsWith('e_') ? 120 : 76), h: n.h || 18 }; }
  update(dt) {
    this.t += dt;
    if (Input.pressed('cancel') || Input.pressed('blueprint')) { AudioSys.play('ui_back'); Game.pop(); return; }
    if (Input.keyPressed('Tab') || Input.keyPressed('KeyQ') || Input.keyPressed('KeyR')) { this.tab = (this.tab + 1) % this.tabs.length; this.pickDefault(); this.packets = []; AudioSys.play('ui_move'); }
    const tr = this.tabRects && this.tabRects.findIndex(b => UI.clicked(b.x, b.y, b.w, b.h));
    if (tr != null && tr >= 0) { this.tab = tr; this.pickDefault(); this.packets = []; return; }
    const nr = this.nodeRects && this.nodeRects.find(b => UI.clicked(b.x, b.y, b.w, b.h));
    if (nr) { this.sel = nr.id; this.play(); return; }
    const dirs = [['left', -1, 0], ['right', 1, 0], ['up', 0, -1], ['down', 0, 1]];
    for (const [a, dx, dy] of dirs) {
      if (!Input.nav(a)) continue;
      const c = this.pos(this.sel);
      let best = null, bd = 1e9;
      for (const id of this.nodes()) {
        if (id === this.sel || BP_NODES[id].group && this.nodes().length > 2 && id === 'cpu' && this.sel !== 'cpu' && false) continue;
        const q = this.pos(id);
        const vx = q.x + q.w / 2 - (c.x + c.w / 2), vy = q.y + q.h / 2 - (c.y + c.h / 2);
        const along = vx * dx + vy * dy;
        if (along <= 4) continue;
        const d = along + Math.abs(vx * dy + vy * dx) * 2;
        if (d < bd) { bd = d; best = id; }
      }
      if (best) { this.sel = best; AudioSys.play('ui_move'); }
    }
    if (Input.pressed('confirm') || Input.keyPressed('KeyP')) this.play();
    for (const p of this.packets) p.t += dt * 0.7;
    this.packets = this.packets.filter(p => p.t < 1);
  }
  edges() { return BP_EDGES[this.tabs[this.tab].id]; }
  play() {
    if (!this.known(this.sel)) return;
    AudioSys.play('bridge');
    for (const e of this.edges()) {
      if (e[0] !== this.sel && e[1] !== this.sel) continue;
      if (!this.known(e[0]) || !this.known(e[1])) continue;
      const rev = e[1] === this.sel && this.tabs[this.tab].id !== 'evt';
      for (let k = 0; k < 3; k++) this.packets.push({ a: rev ? e[1] : e[0], b: rev ? e[0] : e[1], t: -k * 0.25, type: e[2] });
    }
  }
  anchor(id, toward) {
    const p = this.pos(id), q = this.pos(toward);
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2, tx = q.x + q.w / 2, ty = q.y + q.h / 2;
    const dx = tx - cx, dy = ty - cy;
    if (Math.abs(dx) * p.h > Math.abs(dy) * p.w) return { x: cx + sign(dx) * p.w / 2, y: cy + clamp(dy, -p.h / 2 + 3, p.h / 2 - 3) * 0.5 };
    return { x: cx + clamp(dx, -p.w / 2 + 4, p.w / 2 - 4) * 0.5, y: cy + sign(dy) * p.h / 2 };
  }
  render(g) {
    g.fillStyle = '#04121C'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#0A2230'; for (let x = 0; x < W; x += 12) g.fillRect(x, 0, 1, H); for (let y = 0; y < H; y += 12) g.fillRect(0, y, W, 1);
    Font.draw(g, 'BLUEPRINT — ARQUITECTURA-01', 8, 4, PAL.cyan);
    this.tabRects = [];
    let tx = 190;
    this.tabs.forEach((t, i) => {
      const w = Font.measure(t.n) + 10;
      g.fillStyle = i === this.tab ? '#15384A' : '#0A1A24'; g.fillRect(tx, 4, w, 13);
      g.fillStyle = i === this.tab ? PAL.cyan : PAL.panelB; g.fillRect(tx, 16, w, 1);
      Font.draw(g, t.n, tx + 5, 4, i === this.tab ? PAL.white : PAL.gray);
      this.tabRects.push({ x: tx, y: 4, w, h: 13 }); tx += w + 3;
    });
    const tab = this.tabs[this.tab].id;
    // aristas
    const edges = this.edges();
    const lanesOff = { 0: -3, 1: 0, 2: 3 };
    for (const e of edges) {
      const [a, b, type] = e;
      const ka = this.known(a), kb = this.known(b);
      const pa = this.anchor(a, b), pb = this.anchor(b, a);
      const off = typeof type === 'number' ? lanesOff[type] : 0;
      const col = !(ka && kb) ? '#1A3444' : typeof type === 'number' ? BUS_COL[type] : type === 'dep' ? PAL.amber : type === 'evt' ? PAL.red : PAL.cyan;
      const sel = a === this.sel || b === this.sel;
      g.fillStyle = sel && ka && kb ? col : shade(col, 0.6);
      const n = Math.max(1, Math.round(dist(pa.x, pa.y, pb.x, pb.y) / (type === 'dep' ? 4 : 2)));
      for (let i = 0; i <= n; i++) g.fillRect(Math.round(lerp(pa.x, pb.x, i / n)) + (Math.abs(pb.y - pa.y) > Math.abs(pb.x - pa.x) ? off : 0), Math.round(lerp(pa.y, pb.y, i / n)) + (Math.abs(pb.y - pa.y) > Math.abs(pb.x - pa.x) ? 0 : off), 1, 1);
      if (type === 'evt' || type === 'dep') { g.fillStyle = col; g.fillRect(Math.round(pb.x) - 1, Math.round(pb.y) - 1, 3, 3); }
    }
    // nodos
    this.nodeRects = [];
    const drawNode = id => {
      const n = BP_NODES[id], p = this.pos(id), k = this.known(id), sel = id === this.sel;
      if (n.group) {
        g.fillStyle = k ? 'rgba(69,229,255,0.06)' : 'rgba(40,60,70,0.1)'; g.fillRect(p.x, p.y, p.w, p.h);
        g.fillStyle = sel ? PAL.white : k ? PAL.cyan : PAL.grayD;
        for (let x = p.x; x < p.x + p.w; x += 3) { g.fillRect(x, p.y, 1, 1); g.fillRect(x, p.y + p.h - 1, 1, 1); }
        for (let y = p.y; y < p.y + p.h; y += 3) { g.fillRect(p.x, y, 1, 1); g.fillRect(p.x + p.w - 1, y, 1, 1); }
        Font.draw(g, k ? n.n : '???', p.x + 4, p.y - 11, sel ? PAL.white : k ? PAL.cyan : PAL.grayD);
      } else {
        const col = tab === 'evt' ? (id === 'e_nexus' ? PAL.gold : PAL.red) : PAL.cyan;
        g.fillStyle = sel ? shade(col, 0.4) : '#08202C'; g.fillRect(p.x, p.y, p.w, p.h);
        g.fillStyle = k ? (sel ? PAL.white : col) : PAL.grayD; g.fillRect(p.x, p.y, p.w, 1); g.fillRect(p.x, p.y + p.h - 1, p.w, 1); g.fillRect(p.x, p.y, 1, p.h); g.fillRect(p.x + p.w - 1, p.y, 1, p.h);
        const lbl = k ? n.n : '???';
        const lines = UI.wrap(lbl, p.w - 4);
        Font.drawLines(g, lines.slice(0, 2), p.x + p.w / 2 - Math.min(p.w - 4, Font.measure(lines[0])) / 2, p.y + (lines.length > 1 ? -1 : 3), k ? PAL.white : PAL.grayD, { lh: 9 });
      }
      this.nodeRects.push({ x: p.x, y: p.y, w: p.w, h: n.group ? 12 : p.h, id });
    };
    for (const id of this.nodes()) if (BP_NODES[id].group) drawNode(id);
    for (const id of this.nodes()) if (!BP_NODES[id].group) drawNode(id);
    // paquetes animados
    for (const pk of this.packets) {
      if (pk.t < 0) continue;
      const a = this.anchor(pk.a, pk.b), b = this.anchor(pk.b, pk.a);
      const col = typeof pk.type === 'number' ? BUS_COL[pk.type] : pk.type === 'dep' ? PAL.amber : pk.type === 'evt' ? PAL.red : PAL.white;
      g.fillStyle = col; g.fillRect(Math.round(lerp(a.x, b.x, pk.t)) - 1, Math.round(lerp(a.y, b.y, pk.t)) - 1, 3, 3);
    }
    // leyenda y panel de información
    if (tab === 'com') BUS_NAME.forEach((b, i) => { g.fillStyle = BUS_COL[i]; g.fillRect(12 + i * 90, 232, 8, 3); Font.draw(g, 'BUS ' + b, 24 + i * 90, 227, BUS_COL[i]); });
    if (tab === 'dep') Font.draw(g, '- - →  «depende de»: si el origen falla o se satura, el destino lo sufre.', 12, 227, PAL.amber);
    const n = BP_NODES[this.sel];
    g.fillStyle = 'rgba(4,14,20,0.95)'; g.fillRect(0, 238, W, 32); g.fillStyle = PAL.cyan; g.fillRect(0, 238, W, 1);
    if (this.known(this.sel)) {
      Font.draw(g, n.n, 8, 240, PAL.white);
      const conns = this.edges().filter(e => e[0] === this.sel || e[1] === this.sel).map(e => (e[0] === this.sel ? '→ ' + BP_NODES[e[1]].n : '← ' + BP_NODES[e[0]].n) + (typeof e[2] === 'number' ? ' (' + BUS_NAME[e[2]].toLowerCase() + ')' : ''));
      UI.textBlock(g, n.d || '', 8, 251, 300, PAL.grayL, { lh: 9 });
      Font.draw(g, conns.slice(0, 2).join('  '), W - 8, 240, PAL.cyan, { align: 'right' });
    } else Font.draw(g, 'Nodo no descubierto todavía.', 8, 244, PAL.gray);
    UI.keyHints(g, [['↑↓←→', 'Nodo'], ['E', 'Reproducir paquetes'], ['TAB', 'Capa'], ['ESC', 'Cerrar']], W - 4, 256, 'right');
  }
}

function* L0_runFlow(W) {
  const lever = W.ent('run');
  const socks = [1, 2, 3, 4].map(i => W.ent('so' + i));
  if (W.has('L0_flow')) { lever.on = true; return; }
  if (socks.some(s => !s.item)) {
    W.bark('NEXO', 'Faltan módulos en el flujo: las cuatro ranuras deben estar ocupadas.', 'CURIOUS');
    yield 0.4; lever.on = false; return;
  }
  W.lock();
  W.v.attempts = (W.v.attempts || 0) + 1;
  const got = socks.map(s => s.item.p.item);
  const bad = got.findIndex((k, i) => k !== L0_EXPECT[i]);
  W.v.flow = { t: 0, stop: bad < 0 ? 5 : bad + 1, fail: bad >= 0 };
  AudioSys.play('dash');
  const endT = bad < 0 ? 5 : bad + 1;
  while (W.v.flow.t < endT) {
    W.v.flow.t = Math.min(endT, W.v.flow.t + 1 / 60 * 2.2);
    const idx = Math.floor(W.v.flow.t) - 1;
    if (idx >= 0 && idx < 4 && socks[idx] && !socks[idx].lit && (bad < 0 || idx < bad)) { socks[idx].lit = PAL.cyan; AudioSys.play('tick'); }
    yield;
  }
  if (bad >= 0) {
    const s = socks[bad];
    s.lit = PAL.red;
    W.particles.burst(s.cx, s.y, 24, { col: [PAL.red, PAL.amber, PAL.white], max: 100 });
    W.sfx('wrong'); W.shake(3, 0.3);
    W.screenMsg('mon', '▒▒?#%& ERR', PAL.red, 3);
    yield 0.6;
    yield* W.say([
      ['SYS', 'ERROR EN LA RANURA ' + (bad + 1) + ': se esperaba ' + L0_NAMES[L0_EXPECT[bad]] + ', se encontró ' + L0_NAMES[got[bad]] + '.'],
      ['NEXO', L0_WHY[L0_EXPECT[bad]], 'WORRIED'],
      ['NEXO', 'El monitor mostró basura: esa es la consecuencia. Reordena los módulos y vuelve a ejecutar.', 'CURIOUS']
    ]);
    socks.forEach(so => { so.lit = null; });
    W.v.flow = null; lever.on = false;
    W.unlock();
    return;
  }
  // éxito
  W.screenMsg('mon', 'A', PAL.green, 999);
  W.sfx('correct'); W.player.celebrateT = 1.5;
  socks.forEach(so => { so.lit = PAL.green; so.locked = true; });
  LearningModel.record({ concept: 'hardwareBasics', chId: 'L0_flow', correct: true, firstTry: W.v.attempts === 1, hints: 0, time: 30, expected: 60, conf: null, difficulty: 1, prompt: 'Flujo ENTRADA → PROCESO → MEMORIA → SALIDA' });
  Progression.addXP(W.v.attempts === 1 ? 40 : 20, 'flujo');
  yield 0.8;
  yield* W.say([
    ['NEXO', '¡El dato llegó! Pulsaste una tecla, se procesó, se guardó y apareció en pantalla.', 'HAPPY'],
    ['BYTE', 'ENTRADA, PROCESO, MEMORIA, SALIDA. Parece obvio... hasta que hay que construirlo.', 'happy'],
    ['NEXO', 'Ahora observa algo importante. Voy a desconectar la SALIDA.', 'CURIOUS']
  ], { id: 'L0_flowok' });
  socks[3].lit = PAL.red;
  delete W.screenMsgs.mon;
  W.sfx('powerdown');
  yield 1.0;
  yield* W.say([
    ['BYTE', 'La pantalla se apagó... pero los otros módulos siguen parpadeando.', 'surprised'],
    ['NEXO', 'Exacto. Cuando una parte falla, las demás pueden seguir funcionando. El sistema queda *incompleto*, no necesariamente muerto.', 'NEUTRAL'],
    ['NEXO', 'Recuérdalo. En este sistema... es una idea útil.', 'WORRIED', { p: 0.5 }]
  ], { id: 'L0_partial' });
  socks[3].lit = PAL.green;
  W.screenMsg('mon', 'A', PAL.green, 999);
  W.flag('L0_flow');
  W.blueprint(['input', 'output']);
  W.v.flow = null;
  W.unlock();
}

function L1_placeDimm(W, so, b, correct) {
  if (b.p.item !== 'DIMM') { ejectBlock(W, so, b, 'Ese módulo no va en esta ranura.'); return; }
  if (!correct) { ejectBlock(W, so, b, 'Un módulo de memoria no entra en PCIe: la RAM va en una ranura DIMM, junto al controlador de memoria.'); return; }
  so.locked = true; so.lit = PAL.green;
  W.run(function* () {
    W.quest('s1', 'done');
    yield* W.say([['NEXO', 'Módulo DIMM instalado. La ciudad acaba de recuperar 8 GB de memoria de trabajo.', 'HAPPY'], ['BYTE', 'La forma de cada ranura ya te dice qué entra en ella.', 'happy']]);
  }, 'dimm');
}

function L2_station(W, so, b, step) {

        prompt: 'La instrucción es *ADD R1, R2*: el primer operando es también el destino. ¿Dónde se escribe el resultado (8)?',
        data: { options: [O('En R1', 1, 'Sí: R1 ← R1 + R2.'), O('En R2', 0, 'R2 es el segundo operando; el destino es el primero.'), O('En el PC', 0, 'El PC guarda direcciones de instrucciones, no resultados.'), O('En el SSD', 0, 'El resultado va a un registro: rápido y cerca de la ALU.')] },
        explanation: 'WRITE BACK guarda el resultado donde la instrucción indica: aquí, R1. Sin esta etapa, el cálculo se perdería.', hints: ['Lee la instrucción: ADD destino, origen.', '¿Cuál es el primer operando?', 'Descarto dos opciones.'] }, { source: 'terminal', title: 'WRITE BACK' });
      ok = r.ok;
      if (ok) {
        so.lit = PAL.green; b.p.label = 'R1 ← 8';
        W.player.celebrateT = 1.5; W.sfx('victory');
        yield* W.say([
          ['NEXO', '¡Ciclo completo! Buscar, decodificar, ejecutar, escribir.', 'HAPPY'],
          ['NEXO', 'Ahora repítelo unos tres mil millones de veces por segundo.', 'HAPPY'],

function drawGateDiagram(g, W, x, y, gate, ins, out, need) {
  const w = 104, h = 48;
  g.fillStyle = 'rgba(8,6,4,0.8)'; g.fillRect(x, y, w, h);
  g.fillStyle = W.theme.light; g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1);
  const gy0 = y + 10, gy1 = y + h - 10;
  ins.forEach((inp, i) => {
    const yy = ins.length === 1 ? (gy0 + gy1) / 2 : lerp(gy0, gy1, i / (ins.length - 1));
    Font.draw(g, inp.n + '=' + inp.v, x + 3, yy - 6, inp.v ? PAL.cyan : PAL.gray);
    g.fillStyle = inp.v ? PAL.cyan : '#3A2A20';
    g.fillRect(x + 40, Math.round(yy), 16, 1);
    g.fillRect(x + 56, Math.round(Math.min(yy, y + 24)), 1, Math.abs(Math.round(yy) - (y + 24)) + 1);
  });
  g.fillStyle = PAL.amber; g.fillRect(x + 56, y + 14, 24, 20); g.fillStyle = '#1A0E06'; g.fillRect(x + 57, y + 15, 22, 18);
  Font.draw(g, gate, x + 68, y + 17, PAL.white, { align: 'center' });
  g.fillStyle = out ? PAL.green : '#3A2A20'; g.fillRect(x + 80, y + 24, 10, 1);
  g.fillStyle = out ? PAL.green : '#402010'; g.fillRect(x + 91, y + 20, 8, 8);
  Font.draw(g, need != null ? (out === need ? 'ABIERTO' : 'NECESITA ' + need) : String(out), x + w / 2, y + h + 1, out === need ? PAL.green : PAL.amber, { align: 'center' });
}

function* showBlueprint(W, tab) {
  Blueprint.tab(tab);
  const st = new BlueprintState();
  const i = st.tabs.findIndex(t => t.id === tab);
  if (i >= 0) { st.tab = i; st.pickDefault(); }
  Game.push(st);
  yield Task.until(() => !Game.stack.includes(st));
}

class CascadeBoss {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 120; this.h = 80; this.t = 0; this.layer = 3; this.dead = false; this.kind = 'cascade'; this.alwaysUpdate = true;
    this.baseY = y; this.exposed = 0; this.hitsNeed = 3; this.hits = 0; this.fireT = 3; this.alpha = 0; this.enemyish = true; this.fade = 1;
    this.blocks = [];
    for (let i = 0; i < 46; i++) this.blocks.push({ x: rand(-54, 54), y: rand(-34, 34), w: randi(4, 12), h: randi(3, 8), c: pick([PAL.red, PAL.violet, '#A02B38', PAL.white, '#5E3F9E']), s: rand(0.5, 2) });
  }
  get coreX() { return this.x; }
  get coreY() {
    if (this.exposed <= 0) return this.baseY;
    const f = this.exposed < 0.8 ? this.exposed / 0.8 : clamp((6.5 - this.exposed) / 0.8, 0, 1);
    return lerp(this.baseY, this.floorY, easeInOut(f));
  }
  update(W, dt) {
    this.t += dt;
    this.alpha = approach(this.alpha, this.fade, dt);
    const B = W.v.boss;
    if (!B || !B.active) return;
    if (this.exposed > 0) {
      this.exposed -= dt;
      if (this.exposed <= 0) { this.hits = 0; W.bark('NULL', 'El núcleo de CASCADE se recompone. Vuelve a exponerlo.', null, 3); }
      return;
    }
    this.fireT -= dt;
    const inten = 1 + B.phase * 0.12;
    if (this.fireT <= 0 && B.phase < 6) {
      this.fireT = rand(1.6, 2.6) / inten;
      const px = W.player.cx;
      for (let i = 0; i < 2 + Math.floor(B.phase / 2); i++) {
        const tx = px + rand(-90, 90);
        const pr = new Projectile(clamp(tx, W.v.arenaX0 + 8, W.v.arenaX1 - 8), this.baseY + 20, 0, rand(70, 110), { owner: 'enemy', col: pick([PAL.red, PAL.violet]), life: 3.5 });
        W.projectiles.push(pr);
      }
      AudioSys.play('glitch');
    }
  }
  expose(W) { this.exposed = 6.5; this.hits = 0; this.floorY = W.player.y + 7; AudioSys.play('boss', { caption: '[CASCADE se desploma]' }); W.shake(4, 0.5); floatText(W, this.x, this.baseY + 40, '¡NÚCLEO EXPUESTO!', PAL.gold); }
  tryHit(W, px, py, r) {
    if (this.exposed <= 0) return false;
    const cy = this.coreY;
    if (dist(px, py, this.x, cy) < r + 12) {
      this.hits++;
      W.particles.burst(this.x, cy, 20, { col: [PAL.gold, PAL.white, PAL.red], max: 120 });
      AudioSys.play('hit'); W.shake(3, 0.2);
      if (this.hits >= this.hitsNeed) { this.exposed = 0; W.v.boss.onCoreBroken(W); }
      return true;
    }
    return false;
  }
  render(g, W) {
    if (this.alpha <= 0) return;
    g.globalAlpha = this.alpha;
    const B = W.v.boss || {};
    const cx = Math.round(this.x), cy = Math.round(this.baseY);
    const calm = B.phase >= 6;
    for (const b of this.blocks) {
      const dy = ((this.t * 30 * b.s + b.y + 34) % 68) - 34;
      const wob = calm ? 0 : Math.sin(this.t * 3 + b.x) * 3;
      g.fillStyle = calm ? mix(b.c, '#404050', 0.6) : b.c;
      g.fillRect(Math.round(cx + b.x + wob), Math.round(cy + dy), b.w, b.h);
    }
    // tentáculos hacia la consola corrupta
    if (!calm && B.active && B.console) {
      const c = B.console;
      g.fillStyle = PAL.red;
      for (let i = 0; i < 24; i++) { const f = i / 24; g.fillRect(Math.round(lerp(cx, c.cx, f) + Math.sin(this.t * 8 + i) * 3), Math.round(lerp(cy + 30, c.y, f)), 2, 2); }
    }
    // núcleo
    const coreY = Math.round(this.coreY);
    const exp = this.exposed > 0;
    g.fillStyle = exp ? PAL.gold : '#300A14';
    for (let yy = -8; yy <= 8; yy++) { const w = Math.floor(Math.sqrt(64 - yy * yy)); g.fillRect(cx - w, coreY + yy, w * 2, 1); }
    g.fillStyle = exp ? PAL.white : PAL.red; g.fillRect(cx - 3, coreY - 3, 6, 6);
    if (exp) { Font.draw(g, 'NÚCLEO ' + this.hits + '/' + this.hitsNeed, cx, coreY - 22, PAL.gold, { align: 'center' }); if (Math.floor(this.t * 6) % 2) Font.draw(g, '▼', cx, coreY - 34, PAL.gold, { align: 'center' }); }
    if (!calm && Math.random() < 0.2) W.particles.spawn({ x: cx + rand(-50, 50), y: cy + rand(-30, 30), vy: 60, col: pick([PAL.red, PAL.violet]), life: 0.6, kind: 'glitch' });
    g.globalAlpha = 1;
  }
}

    const ms = CONCEPT_KEYS.map(k => [k, LearningModel.mastery(k)]);
    const strong = ms.filter(m => m[1] >= 70).map(m => CONCEPTS[m[0]]);
    const weak = ms.filter(m => m[1] < 40).map(m => CONCEPTS[m[0]]);
    let y = 30;
    const x = 250, w = 214;
    Font.draw(g, 'CONCEPTOS DOMINADOS', x, y, PAL.green); y += 12;
    y += UI.textBlock(g, strong.length ? strong.join(' · ') : 'Aún ninguno por encima del 70%.', x, y, w, PAL.grayL) + 4;
    Font.draw(g, 'CONCEPTOS A REFORZAR', x, y, PAL.amber); y += 12;
    y += UI.textBlock(g, weak.length ? weak.join(' · ') : 'Ninguno por debajo del 40%.', x, y, w, PAL.grayL) + 4;
    const failed = PROG.stats.failed.slice(-3);
    Font.draw(g, 'PREGUNTAS QUE COSTARON', x, y, PAL.violet); y += 12;
    if (!failed.length) { Font.draw(g, 'Ninguna registrada.', x, y, PAL.grayL); y += 12; }
    failed.forEach(f => { const l = UI.wrap('· ' + f.prompt.replace(/\*/g, ''), w)[0]; Font.draw(g, l.length < f.prompt.length ? l : l, x, y, PAL.grayL); y += 12; });
    const st = PROG.stats;
    const acc = st.answered ? Math.round(st.firstTry / st.answered * 100) : 0;
    const by = 140;
    Font.draw(g, 'TIEMPO ' + fmtTime(st.time), 16, by, PAL.white);
    Font.draw(g, 'PRECISIÓN AL 1er INTENTO ' + acc + '%', 16, by + 12, PAL.white);
    Font.draw(g, 'PISTAS USADAS ' + st.hints + '   REPASOS ' + st.reviews, 16, by + 24, PAL.white);
    Font.draw(g, 'MEMORIAS ' + PROG.fragments.length + '/' + TOTAL_FRAGMENTS + '   LETRAS ' + PROG.letters.length + '/5', 16, by + 36, PAL.white);
    Font.draw(g, 'LOGROS ' + PROG.achievements.length + '/' + ACHIEVEMENTS.length + '   MISIONES ' + Object.keys(PROG.quests).filter(k => Quests.done(k)).length + '/' + Object.keys(QUESTS).length, 16, by + 48, PAL.white);
    const explore = weak.slice(0, 2).concat(['memoria virtual', 'predicción de saltos', 'coherencia de caché', 'DMA']).slice(0, 5);
    Font.draw(g, 'PARA CONTINUAR EXPLORANDO', 16, 212, PAL.cyan);
    UI.textBlock(g, explore.join(' · '), 16, 224, 440, PAL.grayL);
    if (this.t > 0.8) Font.draw(g, '[E] ' + (this.o.ending ? 'Volver al menú' : 'Cerrar'), 464, 250, PAL.green, { align: 'right' });
  }
}

// ==================== 99_main.js ====================
// =============================================================================
// ARRANQUE Y GAME LOOP (requestAnimationFrame + deltaTime)
// INPUT → UPDATE (física, colisiones, IA, lógica, lógica educativa, animación, cámara) → RENDER → UI
// =============================================================================
(function main() {
  const canvas = document.getElementById('game');
  const g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  Game.canvas = canvas; Game.g = g;
  const fatal = document.getElementById('fatal');
  let errors = 0;
  window.addEventListener('error', e => {
    errors++;
    console.error(e.error || e.message);
    if (fatal && errors < 4) { fatal.style.display = 'block'; fatal.textContent = 'Error: ' + (e.message || e) + '\n(El juego intentará continuar.)'; setTimeout(() => { fatal.style.display = 'none'; }, 6000); }
  });
  function resize() {
    const sw = window.innerWidth, sh = window.innerHeight;
    let s = Math.min(sw / W, sh / H);
    if (s >= 2) s = Math.floor(s);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();
  // capa de scanlines precalculada
  const sc = makeCanvas(W, H);
  sc.g.fillStyle = 'rgba(0,0,0,0.13)';
  for (let y = 0; y < H; y += 2) sc.g.fillRect(0, y, W, 1);
  Game.scan = sc.c;

  Font.init();
  Sprites.init();
  Input.init(canvas);
  Settings.load();
  AudioSys.onCaption = t => UI.caption(t);
  if (!PROG) PROG = newProgress();
  Game.push(new BootState());
  canvas.focus();

  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 1 / 30) dt = 1 / 30;
    if (dt < 0) dt = 0;
    try {
      Input.pollPad();
      Game.update(dt);
      Game.render();
    } catch (e) {
      console.error(e);
      errors++;
      if (fatal && errors < 6) { fatal.style.display = 'block'; fatal.textContent = 'Error: ' + e.message + '\n(El juego intentará continuar.)'; }
    }
    Input.endFrame();
    Perf.tick(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => { if (document.hidden && Game.top() instanceof GameplayState) Game.push(new PauseState(Game.top())); });
  // Gancho de depuración/pruebas automatizadas (sólo lectura y atajos de QA)
  window.__BAQ = { Game, get PROG() { return PROG; }, LEVELS: () => LEVELS, QM, LearningModel, Settings, SaveManager, Input };
})();
