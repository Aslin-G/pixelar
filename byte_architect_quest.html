const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function shuffleNotIdentity(arr) {
  if (arr.length < 2) return arr.slice();
  let a;
  let tries = 0;
  do { a = shuffle(arr); tries++; } while (tries < 20 && a.every((v, i) => v === arr[i]));
  return a;
}
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function fmtTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = n => (n < 10 ? '0' + n : '' + n);
  return h > 0 ? h + ':' + p(m) + ':' + p(ss) : p(m) + ':' + p(ss);
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);
}
function shade(hex, f) { // f < 1 oscurece, f > 1 aclara
  const [r, g, b] = hexToRgb(hex);
  if (f <= 1) return rgbToHex(r * f, g * f, b * f);
  const k = f - 1;
  return rgbToHex(r + (255 - r) * k, g + (255 - g) * k, b + (255 - b) * k);
}
function mix(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  return rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}

// ---------- Canvas ----------
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);

  g.imageSmoothingEnabled = false;
  return { c, g };
}

// ---------- Tareas para el sistema de scripts (corutinas con generadores) ----------
const Task = {
  wait(t) { let e = 0; return { update(dt) { e += dt; }, done() { return e >= t; } }; },
  frame() { let n = 0; return { update() { n++; }, done() { return n >= 1; } }; },
  until(fn) { return { update() {}, done: fn }; },
  signal() {
    return {
      _d: false, result: undefined,
      update() {}, done() { return this._d; },
      finish(r) { this._d = true; this.result = r; }
    };
  }
};

class ScriptRunner {
  constructor() { this.threads = []; }
  run(genFn, opts = {}) {
    const it = typeof genFn === 'function' ? genFn() : genFn;
    const th = { it, wait: null, blocking: opts.blocking !== false, done: false, name: opts.name || '' };
    this.threads.push(th);
    this.step(th);
    return th;
  }
  step(th) {
    let guard = 0;
    while (!th.done && guard++ < 500) {
      if (th.wait && !th.wait.done()) return;
      let r;
      try {
        r = th.it.next(th.wait ? th.wait.result : undefined);
      } catch (e) {
        console.error('Script error', th.name, e);
        th.done = true;
        return;
      }
      th.wait = null;
      if (r.done) { th.done = true; return; }
      const v = r.value;
      if (v && typeof v.done === 'function') th.wait = v;
      else if (typeof v === 'number') th.wait = Task.wait(v);
      else th.wait = Task.frame();
    }
  }
  update(dt) {
    for (let i = 0; i < this.threads.length; i++) {
      const th = this.threads[i];
      if (th.wait && th.wait.update) th.wait.update(dt);
      this.step(th);
    }
    if (this.threads.some(t => t.done)) this.threads = this.threads.filter(t => !t.done);
  }
  get blocking() { return this.threads.some(t => t.blocking && !t.done); }
  get busy() { return this.threads.length > 0; }
  clear() { this.threads.length = 0; }
}

// ---------- Pool genérico ----------
class Pool {
  constructor(n, make) { this.items = []; for (let i = 0; i < n; i++) this.items.push(make()); this.next = 0; }
  get() {
    for (let k = 0; k < this.items.length; k++) {
      const i = (this.next + k) % this.items.length;
      if (!this.items[i].active) { this.next = (i + 1) % this.items.length; return this.items[i]; }
    }
    const it = this.items[this.next]; this.next = (this.next + 1) % this.items.length; return it;
  }
}

class PixelArt {

  get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.d[y * this.w + x] : null; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, c); }

      if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) add.push(x, y);

function drawShell(p, pal, broken) {

  p.rect(cx - 3, cy - 4, 7, 1, pal.screen);
  p.rect(cx - 3, cy + 3, 7, 1, pal.screen);
  // aletas
  p.rect(cx - 8, cy - 1, 2, 3, pal.fin); p.rect(cx + 7, cy - 1, 2, 3, pal.fin);

    p.px(cx - 1, cy - 9, pal.ant); p.px(cx + 1, cy - 9, pal.ant); p.px(cx - 1, cy - 10, pal.tip); p.px(cx + 1, cy - 10, pal.tip);

    p.px(cx + 2, cy - 9, pal.ant); p.px(cx, cy - 9, pal.ant); p.px(cx + 3, cy - 10, pal.tip);

  p.px(cx - 1, cy + 7, pal.fin); p.px(cx, cy + 7, pal.fin); p.px(cx + 1, cy + 7, pal.fin);
}

    p.rect(13, 3, 3, 3, '#0E3B4A'); p.px(14, 4, W);
    p.px(4, 4, R); p.px(5, 3, R); p.px(6, 4, R); p.px(5, 5, R); p.px(9, 5, R); p.px(10, 6, R); p.px(11, 5, R); p.px(10, 4, R);
    p.rect(3, 10, 3, 2, K); p.rect(12, 10, 3, 2, K); p.px(4 + f, 10, '#6F7C86'); p.px(13 + f, 10, '#6F7C86');
  });
  // OverHeat: chip ardiente
  E.overheat = mk(16, 16, (p, f) => {
    const O = '#FF8A3D', R = '#FF5964', Y = '#FFD166', K = '#3A1A10';
    p.rect(3, 4, 10, 10, K); p.rect(4, 5, 8, 8, R); p.rect(6, 7, 4, 4, O); p.rect(7, 8, 2, 2, Y);
    for (let i = 0; i < 4; i++) { p.px(2, 5 + i * 2, '#6F7C86'); p.px(13, 5 + i * 2, '#6F7C86'); }
    p.px(5 + f, 2, O); p.px(8 - f, 1, Y); p.px(11 + f, 2, O); p.px(7, 3, R);
  });
  E.overheatCool = mk(16, 16, (p, f) => {
    const B = '#45E5FF', D = '#1D5C7A', K = '#0B1A24';
    p.rect(3, 4, 10, 10, K); p.rect(4, 5, 8, 8, D); p.rect(6, 7, 4, 4, B);
    for (let i = 0; i < 4; i++) { p.px(2, 5 + i * 2, '#6F7C86'); p.px(13, 5 + i * 2, '#6F7C86'); }
    p.px(6 + f, 2, '#E8F4F7');
  });
  // Deadlock: candado con ojos
  E.deadlock = mk(16, 16, (p, f) => {
    const G = '#8C8FA8', D = '#4A4C66', V = '#AA7DFF', W = '#E8F4F7';
    p.rect(5, 1, 6, 1, G); p.rect(4, 2, 2, 5, G); p.rect(10, 2, 2, 5, G);
    p.rect(2, 6, 12, 9, D); p.rect(3, 7, 10, 7, G);
    p.rect(5, 9, 2, 2, W); p.rect(9, 9, 2, 2, W); p.px(6 - f, 10, '#050709'); p.px(10 - f, 10, '#050709');
    p.px(7, 12, V); p.px(8, 12, V); p.px(8, 13, V);
  });
  // NullPointer: cursor sin destino
  E.nullpointer = mk(14, 16, (p, f) => {
    const W = '#E8F4F7', V = '#AA7DFF', M = '#FF4FA3';
    const rows = ['#.........', '##........', '#w#.......', '#ww#......', '#www#.....', '#wwww#....', '#wwwww#...', '#wwwwww#..', '#www####..', '#w#w#.....', '##.#w#....', '#...#w#...', '.....##...'];
    p.rows(2, 1, rows, { '#': V, w: f ? W : '#C7A8FF' });
    p.px(10, 13, M); p.px(12, 13, M);
  });
  // PacketStorm: nube de paquetes
  E.packetstorm = mk(22, 16, (p, f) => {
    const K = '#2A2438', D = '#3E3656', C = ['#45E5FF', '#F1B45C', '#71FF9A', '#FF5964'];
    p.circle(7, 7, 5, D); p.circle(13, 6, 6, D); p.circle(17, 9, 4, D); p.rect(4, 8, 16, 5, D);
    p.rect(5, 9, 14, 3, K);
    for (let i = 0; i < 6; i++) p.rect(4 + i * 3, 3 + ((i + f) % 3) * 2, 2, 2, C[i % 4]);
    p.rect(8, 13, 6, 2, K); p.px(10 + f, 14, '#FF5964');
  });
  // Dron de entrenamiento
  E.drone = mk(14, 12, (p, f) => {
    const G = '#6F7C86', C = '#45E5FF', D = '#3A444C';
    p.circle(7, 6, 4, G); p.rect(5, 5, 5, 3, D); p.px(7, 6, C);
    p.rect(0, 2 + f, 4, 1, D); p.rect(10, 2 + f, 4, 1, D); p.px(2, 3, G); p.px(11, 3, G);
  });
  Sprites.enemies = E;
};

Sprites.buildObjects = function () {
  const O = {};
  const one = (w, h, fn, noOutline) => { const p = new PixelArt(w, h); fn(p); if (!noOutline) p.outline(); return p.toCanvas(); };
  O.terminal = one(16, 18, p => {
    p.rect(1, 1, 14, 11, '#3A444C'); p.rect(2, 2, 12, 9, '#0B1620');
    p.rect(6, 12, 4, 3, '#3A444C'); p.rect(3, 15, 10, 2, '#6F7C86'); p.rect(3, 15, 10, 1, '#A9B6BE');
  });
  O.checkpoint = one(12, 26, p => {
    p.rect(3, 8, 6, 16, '#3A444C'); p.rect(4, 8, 1, 16, '#6F7C86'); p.rect(2, 22, 8, 3, '#6F7C86'); p.rect(1, 24, 10, 2, '#3A444C');
    p.rect(2, 6, 8, 2, '#6F7C86'); p.rect(3, 1, 6, 5, '#0B1620');
  });
  O.fragment = [0, 1, 2].map(f => one(10, 12, p => {
    const w = [3, 2, 1][f];
    for (let y = 0; y < 10; y++) {
      const hw = y < 5 ? Math.ceil((y + 1) * w / 3) : Math.ceil((10 - y) * w / 3);
      for (let x = -hw; x <= hw - 1; x++) p.px(5 + x, y + 1, x < 0 ? '#F1B45C' : '#FFD166');
    }
    p.px(5 - Math.max(0, w - 2), 3, '#FFFFFF');
  }));
  O.lever = [0, 1].map(on => one(10, 14, p => {
    p.rect(1, 10, 8, 3, '#3A444C'); p.rect(2, 10, 6, 1, '#6F7C86');
    const tipx = on ? 7 : 2;
    for (let i = 0; i < 6; i++) p.px(Math.round(lerp(5, tipx, i / 5)), 9 - i, '#A9B6BE');
    p.rect(tipx - 1, 2, 3, 2, on ? '#71FF9A' : '#FF5964');
  }));
  O.plate = [0, 1].map(on => one(18, 6, p => {
    p.rect(1, 3, 16, 2, '#3A444C'); p.rect(3, on ? 2 : 1, 12, on ? 1 : 2, on ? '#71FF9A' : '#A9B6BE');
  }));
  O.linknode = one(12, 16, p => {
    p.rect(4, 5, 4, 10, '#3A444C'); p.rect(2, 13, 8, 2, '#6F7C86'); p.circle(6, 4, 3, '#1D5C7A'); p.rect(5, 3, 2, 2, '#0B1620');
  });
  O.fan = [0, 1, 2].map(f => one(18, 18, p => {
    p.circle(9, 9, 7, '#3A444C'); p.circle(9, 9, 6, '#0B1620');
    const a0 = f * Math.PI / 6;
    for (let k = 0; k < 3; k++) {
      const a = a0 + k * Math.PI * 2 / 3;
      for (let r = 1; r < 6; r++) { p.px(9 + Math.round(Math.cos(a) * r), 9 + Math.round(Math.sin(a) * r), '#A9B6BE'); p.px(9 + Math.round(Math.cos(a + 0.35) * r), 9 + Math.round(Math.sin(a + 0.35) * r), '#6F7C86'); }
    }
    p.px(9, 9, '#45E5FF');
  }));
  O.socket = one(20, 10, p => {
    p.rect(0, 4, 20, 6, '#3A444C'); p.rect(1, 4, 18, 1, '#6F7C86'); p.rect(4, 2, 12, 3, '#0B1620'); p.rect(5, 3, 10, 1, '#1D5C7A');
  });
  O.block = { INPUT: '#45E5FF', PROCESS: '#71FF9A', MEMORY: '#AA7DFF', OUTPUT: '#F1B45C', INSTR: '#FFD166', DIMM: '#71FF9A', PACKET: '#45E5FF', LOG: '#F1B45C' };
  O.blockSprites = {};
  for (const k in O.block) {
    const col = O.block[k];
    O.blockSprites[k] = one(16, 14, p => {
      p.rect(1, 1, 14, 12, shade(col, 0.45)); p.rect(2, 2, 12, 10, shade(col, 0.7)); p.rect(2, 2, 12, 1, col);
      // iconos
      const I = (rows) => p.rows(4, 4, rows, { '#': col, w: '#E8F4F7' });
      if (k === 'INPUT') I(['########', '#w#w#w##', '########', '..####..']);
      else if (k === 'PROCESS') I(['.######.', '##w##w##', '.######.', '##w##w##', '.######.']);
      else if (k === 'MEMORY') I(['########', '#w#w#w##', '########', '#.#.#.#.']);
      else if (k === 'OUTPUT') I(['########', '#wwwwww#', '#wwwwww#', '########', '...##...']);
      else if (k === 'INSTR') I(['##.#.##.', '.#.#.#..', '##.#.##.', '.#.#.#..']);
      else if (k === 'DIMM') I(['########', '#w#w#w##', '#w#w#w##', '#.#.#.#.']);
      else if (k === 'PACKET') I(['########', '#w....w#', '#.w..w.#', '########']);
      else I(['#wwwww..', '#.......', '#wwww...', '#.......', '#www....']);
    });
  }
  O.historic = one(16, 20, p => {
    p.rect(1, 2, 14, 12, '#5A4A3A'); p.rect(2, 3, 12, 10, '#0B1206'); p.rect(0, 14, 16, 5, '#5A4A3A'); p.rect(1, 15, 14, 1, '#8A7A5A');
    for (let i = 0; i < 5; i++) p.px(3 + i * 2, 17, '#2A2218');
  });
  Sprites.objects = O;
};

// ---------------------------------------------------------------- RETRATOS (32x32) ----
const PORTRAIT_CACHE = new Map();
function portraitByte(p, emo) {
  const C = BYTE_COL;
  p.rect(0, 0, 32, 32, '#0E2230');
  // cuello y sudadera
  p.rect(6, 26, 20, 6, C.hood); p.rect(6, 26, 20, 1, C.hoodHi); p.rect(15, 27, 2, 5, C.trim); p.rect(8, 25, 16, 2, C.hoodSh);
  // cara
  p.rect(9, 9, 14, 15, C.skin); p.rect(10, 24, 12, 1, C.skinSh); p.rect(9, 20, 1, 4, C.skinSh);
  p.rect(7, 13, 2, 4, C.skinSh); p.rect(23, 13, 2, 4, C.skinSh);
  // pelo
  p.rect(8, 3, 16, 7, C.hair); p.rect(7, 5, 2, 10, C.hair); p.rect(23, 5, 2, 9, C.hair);
  p.px(11, 2, C.hair); p.px(12, 2, C.hairHi); p.px(16, 1, C.hair); p.px(17, 2, C.hair); p.px(21, 2, C.hair);
  p.rect(10, 4, 6, 1, C.hairHi); p.rect(9, 10, 5, 2, C.hair); p.rect(18, 10, 3, 1, C.hair);
  // visor subido en la frente
  p.rect(8, 7, 16, 3, C.visorD); p.rect(9, 8, 14, 1, C.visor); p.px(20, 8, '#FFFFFF');
  // ojos según emoción
  const eye = (x, y, open) => { if (open === 2) { p.rect(x, y, 3, 3, '#FFFFFF'); p.rect(x + 1, y + 1, 2, 2, '#1A1A2E'); } else if (open) { p.rect(x, y, 3, 2, '#FFFFFF'); p.rect(x + 1, y, 2, 2, '#1A1A2E'); } else p.rect(x, y + 1, 3, 1, '#1A1A2E'); };
  const brow = (x, y, tilt) => { p.px(x, y + (tilt > 0 ? 1 : 0), C.hair); p.px(x + 1, y, C.hair); p.px(x + 2, y + (tilt < 0 ? 1 : 0), C.hair); };
  const mouth = (kind) => {
    const K = '#7A3B3B';
    if (kind === 'smile') { p.px(13, 20, K); p.rect(14, 21, 4, 1, K); p.px(18, 20, K); }
    else if (kind === 'open') { p.rect(14, 20, 4, 3, K); p.rect(15, 21, 2, 1, '#E8F4F7'); }
    else if (kind === 'frown') { p.px(13, 22, K); p.rect(14, 21, 4, 1, K); p.px(18, 22, K); }
    else if (kind === 'flat') p.rect(14, 21, 4, 1, K);
    else if (kind === 'small') p.rect(15, 21, 2, 1, K);
    else p.rect(14, 21, 3, 1, K);
  };
  switch (emo) {
    case 'happy': eye(12, 15, 0); eye(18, 15, 0); p.px(12, 15, '#1A1A2E'); p.px(14, 15, '#1A1A2E'); p.px(18, 15, '#1A1A2E'); p.px(20, 15, '#1A1A2E'); mouth('smile'); break;
    case 'laugh': eye(12, 15, 0); eye(18, 15, 0); mouth('open'); break;
    case 'surprised': eye(12, 14, 2); eye(18, 14, 2); brow(12, 12, 0); brow(18, 12, 0); mouth('open'); break;
    case 'sad': eye(12, 16, 1); eye(18, 16, 1); brow(12, 14, 1); brow(18, 14, -1); mouth('frown'); break;
    case 'guilty': eye(12, 17, 0); eye(18, 17, 0); brow(12, 14, 1); brow(18, 14, -1); mouth('small'); break;
    case 'angry': eye(12, 15, 1); eye(18, 15, 1); brow(12, 13, -1); brow(18, 13, 1); mouth('frown'); break;
    case 'determined': eye(12, 15, 1); eye(18, 15, 1); brow(12, 13, -1); brow(18, 13, 1); mouth('flat'); break;
    case 'worried': eye(12, 15, 1); eye(18, 15, 1); brow(12, 13, 1); brow(18, 13, -1); mouth('small'); break;
    case 'thinking': eye(12, 15, 1); eye(18, 14, 1); brow(18, 12, 0); mouth('flat'); break;
    default: eye(12, 15, 1); eye(18, 15, 1); mouth('');
  }
}
function portraitShell(p, pal, broken, scale) {
  p.rect(0, 0, 32, 32, broken ? '#140A1E' : '#08202A');
  const cx = 16, cy = 17;
  p.circle(cx, cy, 12, pal.shell);
  for (let y = -12; y <= 12; y++) for (let x = -12; x <= 12; x++) {
    if (!p.get(cx + x, cy + y) || p.get(cx + x, cy + y) !== pal.shell) continue;
    if (x + y > 11) p.px(cx + x, cy + y, pal.sh); else if (x + y < -13) p.px(cx + x, cy + y, pal.hi);
  }
  p.rect(cx - 8, cy - 6, 17, 12, pal.screen); p.rect(cx - 7, cy - 7, 15, 1, pal.screen); p.rect(cx - 7, cy + 6, 15, 1, pal.screen);
  if (!broken) { p.rect(cx, 1, 1, 4, pal.ant); p.px(cx - 1, 1, pal.tip); p.px(cx + 1, 1, pal.tip); p.px(cx - 2, 0, pal.tip); p.px(cx + 2, 0, pal.tip); }
  else {
    p.rect(cx + 2, 1, 1, 4, pal.ant); p.px(cx + 4, 0, pal.tip);
    const holes = [[-11, -3], [-12, 0], [-11, 2], [-10, 3], [9, 8], [10, 6], [4, 11], [-4, -12], [12, -3], [-8, 9], [7, -10]];
    for (const [x, y] of holes) { p.px(cx + x, cy + y, null); p.px(cx + x + 1, cy + y, pal.crack); }
  }
}
function portraitEyes(p, emo, col) {
  const cx = 16, cy = 17;
  const e = (x, y, w, h, c) => p.rect(cx + x, cy + y, w, h, c || col);
  switch (emo) {
    case 'HAPPY': e(-6, 0, 2, 2); e(-4, -2, 2, 2); e(-2, 0, 2, 2); e(2, 0, 2, 2); e(4, -2, 2, 2); e(6, 0, 2, 2); break;
    case 'CURIOUS': e(-6, -2, 4, 4); e(2, -4, 5, 6); break;
    case 'WORRIED': e(-6, 0, 4, 3); e(2, 0, 4, 3); e(-6, -3, 2, 1); e(-4, -4, 2, 1); e(4, -4, 2, 1); e(6, -3, 1, 1); break;
    case 'AFRAID': e(-6, 0, 2, 2); e(5, 0, 2, 2); break;
    case 'GUILTY': e(-7, 2, 4, 2); e(1, 2, 4, 2); break;
    case 'ANGRY': e(-6, 0, 4, 2, '#FF5964'); e(2, 0, 4, 2, '#FF5964'); e(-6, -3, 2, 1, '#FF5964'); e(-4, -2, 2, 1, '#FF5964'); e(4, -2, 2, 1, '#FF5964'); e(6, -3, 2, 1, '#FF5964'); break;
    case 'SAD': e(-6, 0, 2, 1); e(-4, 1, 2, 1); e(4, 1, 2, 1); e(6, 0, 2, 1); break;
    case 'HOPEFUL': e(-6, -2, 4, 4); e(2, -2, 4, 4); e(-6, -2, 1, 1, '#FFFFFF'); e(2, -2, 1, 1, '#FFFFFF'); break;
    default: e(-6, -2, 4, 4); e(2, -2, 4, 4);
  }
}
function portraitNPC(p, id) {

function buildTileAtlas(th) {

    if (m & 4) r(ox, oy + 15, 16, 1, darker);
    if (m & 8) r(ox, oy, 1, 16, mix(base, light, 0.15));

function buildBackground(th, key) {
  const BW = 512;

  const rng = mulberry32(key.length * 7919 + 17);
  const F = far.g, M = mid.g;

  // cielo en bandas (sin degradados suaves)

  for (let i = 0; i < bands.length; i++) R(F, 0, Math.floor(i * H / bands.length), BW, Math.ceil(H / bands.length) + 1, bands[i]);
  const farC = th.far, midC = th.mid, lightDim = mix(th.light, th.far, 0.55), accDim = mix(th.accent, th.far, 0.5);
  const circle = (g, cx, cy, rad, col) => { for (let y = -rad; y <= rad; y++) { const w = Math.floor(Math.sqrt(rad * rad - y * y)); R(g, cx - w, cy + y, w * 2 + 1, 1, col); } };

      for (let i = 0; i < 6; i++) { const x = rng() * BW; R(M, x, 60 + rng() * 60, 6, H, midC); R(M, x + 2, 64 + rng() * 40, 2, 2, th.light); }

    }
    case 'board': {
      for (let i = 0; i < 14; i++) {
        const w = 24 + rng() * 50, h = 40 + rng() * 110, x = rng() * BW, y = H - 50 - h;
        R(F, x, y, w, h + 50, farC);
        for (let py = y + 4; py < y + h; py += 6) { R(F, x - 2, py, 2, 2, lightDim); R(F, x + w, py, 2, 2, lightDim); }
        for (let k = 0; k < 6; k++) R(F, x + 3 + rng() * (w - 6), y + 4 + rng() * (h - 8), 2, 1, rng() < 0.5 ? accDim : lightDim);
      }
      for (let i = 0; i < 12; i++) {
        const y = 120 + rng() * 140, x = rng() * BW, len = 40 + rng() * 120;
        R(M, x, y, len, 2, midC); R(M, x + len, y - 20, 2, 22, midC); circle(M, x, y + 1, 2, th.accent);

      for (let i = 0; i < 6; i++) { const x = rng() * BW, h = 18 + rng() * 14; R(M, x, H - 40 - h, 10, h, midC); R(M, x, H - 40 - h, 10, 2, mix(midC, th.light, 0.3)); }
      break;
    }
    case 'cpu': {
      for (let i = 0; i < 6; i++) {
        const cx = rng() * BW, cy = 60 + rng() * 150, rad = 18 + rng() * 30;
        circle(F, cx, cy, rad, farC); circle(F, cx, cy, rad * 0.35, bands[1]);
        for (let a = 0; a < 12; a++) { const an = a * Math.PI / 6; R(F, cx + Math.cos(an) * (rad + 2) - 3, cy + Math.sin(an) * (rad + 2) - 3, 6, 6, farC); }
      }
      R(F, 240, 30, 40, H, farC); circle(F, 260, 60, 14, mix(farC, th.accent, 0.3)); circle(F, 260, 60, 12, bands[0]); R(F, 259, 50, 2, 10, th.accent); R(F, 260, 59, 8, 2, th.accent);
      for (let i = 0; i < 5; i++) { const y = 100 + i * 34; R(M, 0, y, BW, 3, midC); R(M, 0, y + 1, BW, 1, mix(midC, th.light, 0.2)); }
      for (let i = 0; i < 8; i++) { const x = rng() * BW; R(M, x, 90 + rng() * 60, 8, H, midC); R(M, x + 2, 120, 4, 6, lightDim); }
      break;
    }
    case 'forge': {
      for (let i = 0; i < 9; i++) {
        const w = 30 + rng() * 40, h = 60 + rng() * 120, x = rng() * BW;
        R(F, x, H - h, w, h, farC); R(F, x + w / 3, H - h - 30, 8, 30, farC);
        for (let k = 0; k < 3; k++) R(F, x + 6 + k * 10, H - h + 12, 6, 8, mix(th.accent, farC, 0.3));
      }
      R(F, 0, 40, BW, 6, mix(bands[2], '#3a1a10', 0.5));
      for (let i = 0; i < 5; i++) { const y = 110 + rng() * 120; R(M, 0, y, BW, 4, midC); for (let x = 0; x < BW; x += 24) R(M, x, y + 4, 3, 10, midC); }
      for (let i = 0; i < 5; i++) { const x = rng() * BW, y = 60 + rng() * 80; R(M, x, y, 18, 12, midC); R(M, x + 2, y + 2, 14, 8, mix(midC, th.light, 0.25)); R(M, x + 5, y + 5, 8, 2, midC); }

      for (let i = 0; i < 6; i++) { const x = rng() * BW; R(M, x, 0, 10, H, midC); R(M, x + 4, 0, 2, H, mix(midC, th.light, 0.15)); }
      break;

    case 'bus': {
      for (let i = 0; i < 10; i++) { const x = i * 52 + rng() * 10; R(F, x, 70, 8, H, farC); R(F, x - 10, 70, 28, 4, farC); }
      for (let k = 0; k < 3; k++) { const y = 90 + k * 26; R(F, 0, y, BW, 3, mix(BUS_COL[k], farC, 0.6)); R(F, 0, y + 1, BW, 1, mix(BUS_COL[k], farC, 0.35)); }
      for (let i = 0; i < 4; i++) { const y = 150 + i * 28; R(M, 0, y, BW, 5, midC); for (let x = 0; x < BW; x += 64) R(M, x + rng() * 20, y + 5, 6, 40, midC); }
      break;
    }
    case 'io': {
      for (let i = 0; i < 10; i++) {
        const x = rng() * BW, t = i % 4, base = H - 40;
        if (t === 0) { R(F, x, base - 100, 60, 70, farC); R(F, x + 4, base - 96, 52, 58, mix(farC, th.light, 0.12)); R(F, x + 26, base - 30, 8, 40, farC); }
        else if (t === 1) { R(F, x, base - 30, 90, 30, farC); for (let k = 0; k < 8; k++) R(F, x + 4 + k * 11, base - 26, 8, 6, mix(farC, th.accent, 0.15)); }
        else if (t === 2) { R(F, x + 10, base - 150, 4, 150, farC); R(F, x, base - 150, 24, 3, farC); R(F, x + 11, base - 156, 2, 4, th.accent); }

      }
      for (let i = 0; i < 6; i++) { const x = rng() * BW, y = 70 + rng() * 60; for (let k = 0; k < 60; k++) R(M, x + k, y + Math.sin(k / 60 * Math.PI) * 14, 1, 1, midC); }

      }
      for (let i = 0; i < 4; i++) { const x = rng() * BW; R(M, x, 60, 10, 130, midC); R(M, x + 3, 80, 4, 100, mix(th.accent, midC, 0.5)); circle(M, x + 5, 195, 8, midC); circle(M, x + 5, 195, 5, mix(th.accent, midC, 0.4)); }
      break;
    }
    case 'kernel': {
      for (let i = 0; i < 7; i++) {
        const x = rng() * BW, w = 20 + rng() * 30, h = 60 + rng() * 120;
        R(F, x, H - h, w, h, farC); R(F, x + w * 0.3, H - h - 6, w * 0.4, 6, farC);
        if (rng() < 0.6) R(F, x + 4, H - h + 10, w - 8, 12, mix(farC, th.accent, 0.08));
      }
      for (let i = 0; i < 5; i++) { const x = rng() * BW, y = 60 + rng() * 120; R(M, x, y, 30, 2, midC); R(M, x, y, 2, 24, midC); R(M, x + 28, y + 6, 2, 14, midC); }
      break;
    }
    case 'core': {
      for (let k = 0; k < 6; k++) ring(F, 256, 135, 30 + k * 26, mix([th.light, th.accent, '#F1B45C'][k % 3], farC, 0.55));
      for (let a = 0; a < 16; a++) { const an = a * Math.PI / 8; for (let r2 = 20; r2 < 260; r2 += 3) R(F, 256 + Math.cos(an) * r2, 135 + Math.sin(an) * r2, 1, 1, mix(BUS_COL[a % 3], farC, 0.6)); }
      circle(F, 256, 135, 16, mix(th.accent, farC, 0.3)); circle(F, 256, 135, 10, mix('#FFD166', farC, 0.3));
      for (let i = 0; i < 10; i++) { const y = 100 + rng() * 160, x = rng() * BW, len = 30 + rng() * 80; R(M, x, y, len, 2, midC); circle(M, x + len, y + 1, 2, pick([th.light, th.accent, '#F1B45C'])); }
      break;
    }
  }
  return { far: far.c, mid: mid.c, w: BW };
}

function getTheme(key) {
  if (ThemeCache[key]) return ThemeCache[key];
  const th = Object.assign({ key }, THEMES[key] || THEMES.boot);
  th.atlas = buildTileAtlas(th);
  th.bg = buildBackground(th, key);
  ThemeCache[key] = th;
  return th;
}

const AudioSys = {
  ctx: null, ok: false, master: null, musicGain: null, sfxGain: null, noiseBuf: null,
  vol: { master: 0.8, music: 0.55, sfx: 0.8 },
  onCaption: null, muffled: false,
  unlock() {
    try {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      this.ctx = ctx;
      this.master = ctx.createGain();
      this.comp = ctx.createDynamicsCompressor();
      this.master.connect(this.comp); this.comp.connect(ctx.destination);
      this.musicGain = ctx.createGain(); this.musicGain.connect(this.master);

    { id: 'nextAbility', x: 380, y: 140, w: 40, h: 30, label: 'HAB' }, { id: 'pause', x: 436, y: 4, w: 40, h: 22, label: 'II' },
    { id: 'hint', x: 392, y: 4, w: 40, h: 22, label: 'H' }
  ],
  touchButtonAt(x, y) {
    if (!this.touch.enabled || !this.touchGameplay) return null;
    for (const b of this.TOUCH_BTNS) if (x >= b.x && y >= b.y && x < b.x + b.w && y < b.y + b.h) return b.id;
    return null;
  },
  pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads && Array.from(pads).find(p => p && p.connected);
    const prev = this.pad.held; const held = {};
    if (gp) {
      const b = i => gp.buttons[i] && gp.buttons[i].pressed;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      held.left = ax < -0.5 || b(14); held.right = ax > 0.5 || b(15); held.up = ay < -0.5 || b(12); held.down = ay > 0.5 || b(13);
      held.jump = b(0); held.confirm = b(0); held.cancel = b(1); held.attack = b(2); held.interact = b(3);
      held.nextAbility = b(5) || b(4); held.ability = b(7) || b(6); held.pause = b(9); held.blueprint = b(8); held.hint = b(10) || b(11);
      if (Object.values(held).some(Boolean)) { this.usingPad = true; AudioSys.unlock(); }
    }
    const pressed = {};
    for (const k in held) if (held[k] && !prev[k]) { pressed[k] = true; this.anyPressed = true; }
    this.pad.held = held; this.pad.pressed = pressed;
  },
  held(a) {
    const ks = this.bind[a];
    if (ks) for (const k of ks) if (this.keys.has(k)) return true;
    return !!(this.pad.held[a] || this.touch.held[a]);
  },
  pressed(a) {
    const ks = this.bind[a];
    if (ks) for (const k of ks) if (this.pressedKeys.has(k)) return true;
    if (a === 'confirm' && this.touch.pressed.jump) return true;
    return !!(this.pad.pressed[a] || this.touch.pressed[a]);
  },
  // Navegación de menús con autorepetición
  nav(a) {
    const ks = this.bind[a];
    if (ks) for (const k of ks) if (this.repeatKeys.has(k)) return true;
    return !!(this.pad.pressed[a] || this.touch.pressed[a]);
  },
  keyPressed(code) { return this.pressedKeys.has(code); },
  endFrame() {
    this.pressedKeys.clear(); this.repeatKeys.clear(); this.anyPressed = false;
    this.pointer.clicked = false; this.pointer.moved = false;
    this.touch.pressed = {};
  },
  keyName(code) {
    if (!code) return '?';
    const map = { Space: 'ESPACIO', Escape: 'ESC', Enter: 'ENTER', Tab: 'TAB', Backspace: 'RETROCESO', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', ShiftLeft: 'SHIFT', ShiftRight: 'SHIFT', ControlLeft: 'CTRL' };
    if (map[code]) return map[code];
    if (code.startsWith('Key')) return code.slice(3);
    if (code.startsWith('Digit')) return code.slice(5);
    return code.toUpperCase();
  },
  label(a) { return this.keyName((this.bind[a] || [])[0]); },
  remap(action, code) {
    // el código nuevo pasa a ser el primario; se elimina de otras acciones de juego para evitar choques
    for (const k of REMAPPABLE) if (k !== action) this.bind[k] = this.bind[k].filter(c => c !== code);
    const rest = this.bind[action].filter(c => c !== code);
    this.bind[action] = [code].concat(rest.slice(0, 1));
  },
  resetBindings() { this.bind = JSON.parse(JSON.stringify(DEFAULT_BINDINGS)); }
};

const SaveManager = {

  save(prog) {
    if (!this.available || !prog || prog.teacher) return false;

      prog.timestamp = Date.now();

      localStorage.setItem(this.KEY, JSON.stringify(prog));

      return migrateProgress(d);
    } catch (e) { console.warn('Guardado corrupto', e); return null; }
  },
  has() { if (!this.available) return false; try { return !!localStorage.getItem(this.KEY); } catch (e) { return false; } },
  clear() { if (!this.available) return; try { localStorage.removeItem(this.KEY); } catch (e) { /* nada */ } },

function newProgress() {

    level: 0, checkpoint: null,
    xp: 0, playerLevel: 1,
    abilities: [], selAbility: 0,
    learning: LearningModel.blank(),

    fragments: [], letters: [], historic: [], achievements: [],
    stats: { time: 0, hints: 0, answered: 0, correct: 0, firstTry: 0, failed: [], deaths: 0, enemies: 0, reviews: 0, levelTimes: {}, noHintStreak: 0, calibrated: 0 },

}
function migrateProgress(d) {
  const base = newProgress();
  for (const k in base) if (d[k] === undefined) d[k] = base[k];
  for (const k in base.stats) if (d.stats[k] === undefined) d.stats[k] = base.stats[k];
  d.learning = LearningModel.fix(d.learning);
  return d;
}

// =============================================================================
// SISTEMA PEDAGÓGICO: modelo de dominio, repaso espaciado, gestor de desafíos,
// progresión (XP / nivel) y logros.
// =============================================================================
let PROG = null; // progreso de la partida actual (se asigna en Game)

const LearningModel = {
  blank() {
    const c = {};
    for (const k of CONCEPT_KEYS) c[k] = { m: 0, att: 0, cor: 0, first: 0, hints: 0, streak: 0, last: 0, misc: 0 };
    return { c, review: [], log: [], playTime: 0, misconceptions: [] };
  },
  fix(l) {
    if (!l || !l.c) return this.blank();
    const b = this.blank();
    for (const k of CONCEPT_KEYS) if (!l.c[k]) l.c[k] = b.c[k];
    l.review = l.review || []; l.log = l.log || []; l.misconceptions = l.misconceptions || []; l.playTime = l.playTime || 0;
    return l;
  },
  L() { return PROG.learning; },
  get(k) { return this.L().c[k] || { m: 0 }; },
  mastery(k) { return Math.round(this.get(k).m); },
  allowedDifficulty(k) {
    const m = this.get(k).m;
    let d = m < 20 ? 2 : m < 45 ? 3 : m < 70 ? 4 : 5;
    const ed = Settings.data.eduDifficulty;
    if (ed === 0) d -= 1; else if (ed === 2) d += 1;
    return clamp(d, 1, 5);
  },
  tick(dt) { if (PROG) this.L().playTime += dt; },
  now() { return this.L().playTime; },
  record(res) {
    const c = this.get(res.concept);
    const L = this.L();
    const diff = res.difficulty || 1, hints = res.hints || 0, conf = res.conf;
    c.att++; c.last = L.playTime; c.hints += hints;
    let delta;
    if (res.firstTry) {
      c.cor++; c.first++; c.streak++;
      delta = 6 + 3 * diff;
      delta *= Math.max(0.35, 1 - 0.22 * hints);
      const exp = res.expected || 30;
      if (res.time < exp * 0.6) delta *= 1.1; else if (res.time > exp * 2.5) delta *= 0.9;
      if (conf === 2) delta *= 1.15; else if (conf === 0) delta *= 0.8;
      if (res.transfer) delta *= 1.3;
      delta *= (1 - c.m / 130);
    } else if (res.correct) {
      c.cor++; c.streak = 0;
      delta = (2 + diff) * Math.max(0.3, 1 - 0.2 * hints) * (res.guided ? 0.5 : 1) * (1 - c.m / 130);
      delta -= conf === 2 ? 3 : 1;
    } else {
      c.streak = 0;
      delta = -(2 + diff * 0.5) - (conf === 2 ? 3 : 0);
    }
    if (res.misconception) {
      c.misc++;
      L.misconceptions.push({ concept: res.concept, id: res.chId, t: Math.round(L.playTime) });
    }
    const before = c.m;
    c.m = clamp(c.m + delta, 0, 100);
    if (!res.firstTry) this.scheduleReview(res.concept, res.chId);
    L.log.push({ t: Math.round(L.playTime), concept: res.concept, id: res.chId, ok: !!res.firstTry, d: Math.round((c.m - before) * 10) / 10 });
    if (L.log.length > 400) L.log.shift();
    // estadísticas globales
    const st = PROG.stats;
    st.answered++;
    if (res.firstTry) { st.correct++; st.firstTry++; }
    else if (!st.failed.some(f => f.id === res.chId)) st.failed.push({ id: res.chId, concept: res.concept, prompt: (res.prompt || '').slice(0, 90) });
    if (hints === 0 && res.firstTry) st.noHintStreak++; else st.noHintStreak = 0;
    if ((res.firstTry && conf === 2) || (!res.firstTry && conf === 0)) st.calibrated++;
    Achievements.check();
    return c.m - before;
  },
  scheduleReview(concept, chId) {
    const L = this.L();
    if (L.review.some(r => r.concept === concept)) return;
    L.review.push({ concept, chId, due: L.playTime + randi(150, 280) });
  },
  dueReview() {
    const L = this.L();
    return L.review.find(r => r.due <= L.playTime) || null;
  },
  completeReview(concept, ok) {
    const L = this.L();
    L.review = L.review.filter(r => r.concept !== concept);
    if (!ok) L.review.push({ concept, due: L.playTime + 200 });
  },
  group(keys) { return Math.round(keys.reduce((s, k) => s + this.get(k).m, 0) / keys.length); },
  groups() {
    return [
      ['FUNDAMENTOS', ['hardwareBasics', 'motherboard']],
      ['CPU', ['cpu', 'fetchDecodeExecute', 'registers']],
      ['ALU', ['alu']],
      ['MEMORIA', ['cache', 'ram', 'storage']],
      ['BUSES', ['buses']],
      ['E/S', ['io', 'interrupts']],
      ['RENDIMIENTO', ['performance', 'parallelism', 'bottlenecks']]
    ].map(([n, ks]) => ({ name: n, keys: ks, value: this.group(ks) }));
  }
};

// ---------------------------------------------------------------- Gestor de desafíos ----
const QM = {
  byId: {}, byConcept: {}, gens: {}, genCount: 0,
  register(list) {
    for (const ch of list) {
      this.byId[ch.id] = ch;
      (this.byConcept[ch.concept] = this.byConcept[ch.concept] || []).push(ch);
    }
  },
  registerGen(concept, fn) { (this.gens[concept] = this.gens[concept] || []).push(fn); },
  used() { return new Set(PROG.usedChallenges); },
  markUsed(id) { if (!PROG.usedChallenges.includes(id)) PROG.usedChallenges.push(id); },
  get(id) { return this.byId[id] || null; },
  generate(concept, diff) {
    const gens = this.gens[concept];
    if (!gens || !gens.length) return null;
    const fn = pick(gens);
    const ch = fn(clamp(diff || 2, 1, 5));
    ch.id = ch.id || ('gen_' + concept + '_' + (++this.genCount) + '_' + Math.floor(Math.random() * 1e6));
    ch.concept = ch.concept || concept;
    ch.generated = true;
    this.byId[ch.id] = ch;
    return ch;
  },
  pick(concept, o = {}) {
    const allowed = o.maxDiff || LearningModel.allowedDifficulty(concept);
    const used = this.used();
    const all = (this.byConcept[concept] || []).filter(ch => !ch.noPick && !(o.types && !o.types.includes(ch.type)));
    let pool = all.filter(ch => !used.has(ch.id) && ch.difficulty <= allowed && (!o.minDiff || ch.difficulty >= o.minDiff));
    if (!pool.length) {
      const g = this.generate(concept, allowed);
      if (g && (!o.types || o.types.includes(g.type))) return g;
      pool = all.filter(ch => ch.difficulty <= allowed + 1);
      if (!pool.length) pool = all;
    }
    if (!pool.length) return this.generate(concept, allowed);
    // preferir la dificultad más alta permitida, con algo de azar
    pool = shuffle(pool).sort((a, b) => Math.abs(allowed - a.difficulty) - Math.abs(allowed - b.difficulty));
    return pool[0];
  },
  variantOf(ch) {
    const used = this.used();
    if (ch.retryVariant && ch.retryVariant !== 'gen') {
      const v = this.byId[ch.retryVariant];
      if (v && !used.has(v.id)) return v;
    }
    const g = this.generate(ch.concept, Math.max(1, ch.difficulty - 1));
    if (g) return g;
    const alt = (this.byConcept[ch.concept] || []).filter(c => c.id !== ch.id && !used.has(c.id) && !c.noPick);
    return alt.length ? pick(alt) : null;
  }
};

// ---------------------------------------------------------------- Progresión ----
const Progression = {
  levelFor(xp) { let l = 1, need = 100; while (xp >= need && l < 20) { l++; need += 100 + (l - 1) * 60; } return l; },
  nextAt(level) { let need = 100; for (let l = 2; l <= level; l++) need += 100 + (l - 1) * 60; return need; },
  prevAt(level) { return level <= 1 ? 0 : this.nextAt(level - 1); },
  upgFor(level) { return level >= 8 ? 3 : level >= 6 ? 2 : level >= 4 ? 1 : 0; },
  addXP(n, reason) {
    if (!PROG || n <= 0) return;
    n = Math.round(n);
    PROG.xp += n;
    if (typeof UI !== 'undefined') UI.toast('+' + n + ' XP' + (reason ? '  ' + reason : ''), PAL.green, 'xp');
    const l = this.levelFor(PROG.xp);
    if (l > PROG.playerLevel) {
      const oldU = this.upgFor(PROG.playerLevel);
      PROG.playerLevel = l;
      AudioSys.play('levelup');
      if (typeof UI !== 'undefined') UI.toast('NIVEL ' + l + ' — capacidad de energía mejorada', PAL.gold);
      const u = this.upgFor(l);
      if (u !== oldU) { Sprites.buildByte(u); if (typeof UI !== 'undefined') UI.toast('Mejora visual desbloqueada', PAL.cyan); }
    }
  },
  maxEnergy() { return 100 + (PROG ? (PROG.playerLevel - 1) * 8 : 0); }
};

const UI = {
  toasts: [], captions: [], wrapCache: new Map(), time: 0,
  hc() { return Settings.data.contrast; },
  panel(g, x, y, w, h, o = {}) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    const hc = this.hc();
    const fill = o.fill || (hc ? '#000000' : PAL.panel), border = o.border || (hc ? '#FFFFFF' : PAL.panelB);
    g.fillStyle = fill; g.fillRect(x + 1, y + 1, w - 2, h - 2);
    g.fillStyle = border;
    g.fillRect(x + 2, y, w - 4, 1); g.fillRect(x + 2, y + h - 1, w - 4, 1);
    g.fillRect(x, y + 2, 1, h - 4); g.fillRect(x + w - 1, y + 2, 1, h - 4);
    g.fillRect(x + 1, y + 1, 1, 1); g.fillRect(x + w - 2, y + 1, 1, 1); g.fillRect(x + 1, y + h - 2, 1, 1); g.fillRect(x + w - 2, y + h - 2, 1, 1);
    if (!o.flat) { g.fillStyle = o.inner || (hc ? '#000000' : PAL.panelL); g.fillRect(x + 2, y + 1, w - 4, 1); }
    if (o.title) {
      const tw = Font.measure(o.title) + 10;
      g.fillStyle = border; g.fillRect(x + 6, y - 5, tw, 11);
      g.fillStyle = fill; g.fillRect(x + 7, y - 4, tw - 2, 9);
      Font.draw(g, o.title, x + 11, y - 5, o.titleCol || PAL.cyan);
    }
  },
  inRect(px, py, x, y, w, h) { return px >= x && py >= y && px < x + w && py < y + h; },
  hover(x, y, w, h) { const p = Input.pointer; return p.active && this.inRect(p.x, p.y, x, y, w, h); },
  clicked(x, y, w, h) { const p = Input.pointer; return p.clicked && this.inRect(p.x, p.y, x, y, w, h); },
  button(g, x, y, w, h, label, focused, o = {}) {
    const hov = this.hover(x, y, w, h);
    const on = focused || hov;
    const col = o.color || PAL.cyan;
    const dis = o.disabled;
    g.fillStyle = dis ? '#0A1016' : on ? shade(col, 0.35) : PAL.panelL; g.fillRect(x, y, w, h);
    g.fillStyle = dis ? PAL.grayD : on ? col : PAL.panelB;
    g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1); g.fillRect(x, y, 1, h); g.fillRect(x + w - 1, y, 1, h);
    if (on && !dis) { g.fillStyle = col; g.fillRect(x - 3, y + Math.floor(h / 2) - 1, 2, 3); }
    Font.draw(g, label, x + Math.floor(w / 2), y + Math.floor((h - 12) / 2) + 1, dis ? PAL.gray : on ? PAL.white : PAL.grayL, { align: 'center' });
    return hov && Input.pointer.clicked && !dis;
  },
  bar(g, x, y, w, h, v, col, bg) {
    v = clamp(v, 0, 1);
    g.fillStyle = bg || '#0A141C'; g.fillRect(x, y, w, h);
    g.fillStyle = col; g.fillRect(x, y, Math.round(w * v), h);
    g.fillStyle = 'rgba(255,255,255,0.18)'; if (h > 2) g.fillRect(x, y, Math.round(w * v), 1);
  },
  keycap(g, x, y, label, col) {
    const w = Font.measure(label) + 6;
    g.fillStyle = '#1B2A36'; g.fillRect(x, y, w, 11);
    g.fillStyle = col || PAL.grayL; g.fillRect(x, y + 10, w, 1);
    Font.draw(g, label, x + 3, y - 1, PAL.white);
    return w;
  },
  // Línea de ayuda de teclas: [['E','Elegir'],['H','Pista']]
  keyHints(g, items, x, y, align = 'left') {
    let total = 0;
    const parts = items.map(([k, l]) => { const w = Font.measure(k) + 6 + 3 + Font.measure(l) + 10; total += w; return w; });
    let cx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
    items.forEach(([k, l], i) => {
      const kw = this.keycap(g, Math.round(cx), y, k);
      Font.draw(g, l, Math.round(cx) + kw + 3, y, PAL.grayL);
      cx += parts[i];
    });
  },
  wrap(text, w, s = 1) {
    const key = w + '|' + s + '|' + text;
    let r = this.wrapCache.get(key);
    if (!r) {
      r = Font.wrap(text, w, s);
      if (this.wrapCache.size > 600) this.wrapCache.clear();
      this.wrapCache.set(key, r);
    }
    return r;
  },
  textBlock(g, text, x, y, w, col, o = {}) {
    const lines = this.wrap(text, w, o.s || 1);
    Font.drawLines(g, lines, x, y, col || PAL.white, o);
    return lines.length * (o.lh || 12) * (o.s || 1);
  },
  pips(g, x, y, n, of, col) {
    for (let i = 0; i < of; i++) { g.fillStyle = i < n ? col : PAL.grayD; g.fillRect(x + i * 5, y, 4, 4); }
  },
  toast(text, col, kind) {
    if (kind === 'xp') {
      const ex = this.toasts.find(t => t.kind === 'xp' && t.t < 1.2);
      if (ex) { const m = /\+(\d+)/.exec(ex.text), n = /\+(\d+)/.exec(text); if (m && n) { ex.text = ex.text.replace(m[0], '+' + (+m[1] + +n[1])); ex.t = 0; return; } }
    }
    this.toasts.push({ text, col: col || PAL.cyan, t: 0, kind });
    if (this.toasts.length > 6) this.toasts.shift();
  },
  caption(text) {
    if (!Settings.data.captions) return;
    this.captions.push({ text, t: 0 });
    if (this.captions.length > 3) this.captions.shift();
  },
  update(dt) {
    this.time += dt;
    for (const t of this.toasts) t.t += dt;
    this.toasts = this.toasts.filter(t => t.t < 3.2);
    for (const c of this.captions) c.t += dt;
    this.captions = this.captions.filter(c => c.t < 2.6);
  },
  drawToasts(g) {
    let y = 60;
    for (const t of this.toasts) {
      const a = t.t < 0.2 ? t.t / 0.2 : t.t > 2.7 ? (3.2 - t.t) / 0.5 : 1;
      const w = Font.measure(t.text) + 12;
      g.globalAlpha = clamp(a, 0, 1);
      g.fillStyle = 'rgba(5,7,9,0.85)'; g.fillRect(W / 2 - w / 2, y, w, 13);
      g.fillStyle = t.col; g.fillRect(W / 2 - w / 2, y + 12, w, 1);
      Font.draw(g, t.text, W / 2, y, t.col, { align: 'center' });
      g.globalAlpha = 1;
      y += 15;
    }
  },
  drawCaptions(g) {
    let y = H - 16;
    for (let i = this.captions.length - 1; i >= 0; i--) {
      const c = this.captions[i];
      const w = Font.measure(c.text) + 8;
      g.fillStyle = 'rgba(0,0,0,0.75)'; g.fillRect(6, y, w, 12);
      Font.draw(g, c.text, 10, y - 1, PAL.grayL);
      y -= 13;
    }
  },
  // Lista vertical navegable genérica (menús)
  menuNav(state, n, o = {}) {
    if (Input.nav('up')) { state.sel = (state.sel - 1 + n) % n; AudioSys.play('ui_move'); }
    if (Input.nav('down')) { state.sel = (state.sel + 1) % n; AudioSys.play('ui_move'); }
  },
  overlayDim(g, a = 0.75) { g.fillStyle = `rgba(3,6,9,${a})`; g.fillRect(0, 0, W, H); }
};


// ==================== 10_challenge.js ====================
// =============================================================================
// DESAFÍOS — ciclo pedagógico completo:
// ERROR → FEEDBACK → PISTA → SEGUNDO INTENTO → EJEMPLO GUIADO → PROBLEMA SIMILAR → REPASO POSTERIOR
// =============================================================================
const VOICE_LINES = {
  ok: {
    NEXO: ['¡Exacto! Lo viste antes de que te lo dijera.', 'Correcto. Eso ya no es memoria: es comprensión.', 'Bien razonado. El sistema acaba de ganar un poco de orden.', 'Sí. Y ahora sabes por qué, que es lo importante.', '¡Eso es! Registro esto como progreso real.', 'Perfecto. Hasta mis ventiladores se relajaron.'],
    TERMINAL: ['VERIFICACIÓN: CORRECTA.', 'RESULTADO VÁLIDO. MÓDULO ESTABLE.', 'CORRECTO. SIN OBSERVACIONES.'],
    NEXUS: ['Correcto. Y lo dudaste lo justo.', 'Bien. Diagnóstico y comprensión a la vez.']
  },
  bad: {
    NEXO: ['Casi. Mira qué pasó exactamente...', 'No pasa nada: equivocarse aquí es barato; entender por qué, valioso.', 'Mmm. El sistema no respondió como esperabas. ¿Por qué será?', 'Ese resultado nos dice algo. Escuchémoslo.'],
    TERMINAL: ['VERIFICACIÓN FALLIDA.', 'RESULTADO INCOHERENTE. REVISE LA CONFIGURACIÓN.'],
    NEXUS: ['No encaja todavía. Lo que falló es información, no un veredicto.']
  }
};
const Voice = {
  speaker() {
    if (!PROG) return 'NEXO';
    if (PROG.flags.nexusBorn) return 'NEXUS';
    if (PROG.flags.nexoAway) return 'TERMINAL';
    return 'NEXO';
  },
  line(kind) { return pick(VOICE_LINES[kind][this.speaker()]); },
  hintTag() { return PROG && PROG.flags.nexoReturned && !PROG.flags.nexusBorn ? 'HIPÓTESIS' : null; }
};
const TYPE_LABEL = {
  choice: 'ANÁLISIS', order: 'ORDENAMIENTO', match: 'ASOCIACIÓN', classify: 'CLASIFICACIÓN', logic: 'LÓGICA',
  bits: 'ARITMÉTICA BINARIA', route: 'ENRUTAMIENTO', memsim: 'SIMULACIÓN DE MEMORIA', sim: 'SIMULACIÓN',
  interrupts: 'GESTIÓN DE INTERRUPCIONES', timing: 'SINCRONIZACIÓN'
};
const SOURCE_TITLE = {
  terminal: ['TERMINAL', PAL.cyan], review: ['ECO DE MEMORIA', PAL.violet], boss: ['EMERGENCIA', PAL.red],
  teacher: ['PRÁCTICA', PAL.green], counter: ['CONTRAMEDIDA', PAL.amber], quest: ['MISIÓN', PAL.gold], world: ['SISTEMA', PAL.cyan]
};
const EXPECTED_TIME = { choice: 25, order: 35, match: 40, classify: 40, logic: 45, bits: 45, route: 60, memsim: 45, sim: 60, interrupts: 70, timing: 30 };

class ChallengeState {
  constructor(ch, o = {}) {
    this.overlay = true;
    this.ch = ch; this.o = o;
    this.attempt = 1; this.hintLevel = 0; this.paidHints = 0; this.conf = null;
    this.phase = 'play'; this.t = 0; this.shakeT = 0; this.flashT = 0; this.flashCol = PAL.green;
    this.hintText = null; this.msg = null; this.msgT = 0;
    this.resultOk = false; this.feedback = ''; this.misconception = null; this.xpGained = 0;
    this.confSel = 1; this.btnSel = 0;
    this.askConf = !o.noConf && ch.difficulty >= 2 && !['route', 'interrupts', 'timing'].includes(ch.type) && (o.forceConf || Math.random() < 0.55);
    this.startT = 0;
    this.hintBtn = { x: 420, y: 12, w: 46, h: 13 };
    this.resBtn = null; this.guideBtn = null; this.confBtns = [];
    QM.markUsed(ch.id);
    this.w = makeWidget(ch, this);
    this.layout();
  }
  layout() {
    this.promptLines = UI.wrap(this.ch.prompt || '', 444);
    const top = 30 + Math.min(5, this.promptLines.length) * 12 + 4;
    this.area = { x: 18, y: top, w: 444, h: 232 - top };
  }
  enter() { AudioSys.muffle(true); }
  exit() { AudioSys.muffle(false); }
  get speaker() { return Voice.speaker(); }
  toastMsg(t) { this.msg = t; this.msgT = 2.2; }

  useHint() {
    if (this.hintLevel >= 3) { this.toastMsg('No quedan más pistas para este desafío.'); return; }
    this.hintLevel++; this.paidHints++;
    PROG.stats.hints++;
    const h = this.ch.hints || [];
    if (this.hintLevel === 1) this.hintText = h[0] || '¿Qué propiedad del sistema es la que realmente importa aquí?';
    else if (this.hintLevel === 2) { this.w.highlight(); this.hintText = h[1] || 'Mira los elementos resaltados: ahí está la clave.'; }
    else { this.w.partial(); this.hintText = h[2] || 'Te muestro una parte de la solución. Completa el resto.'; }
    AudioSys.play('echo');
  }
  submit() {
    if (this.phase !== 'play') return;
    if (!this.w.isReady()) { this.toastMsg(this.w.notReadyMsg || 'Completa todos los elementos antes de verificar.'); AudioSys.play('ui_back'); return; }
    if (this.askConf && this.attempt === 1 && this.conf === null) { this.phase = 'conf'; this.confSel = 1; AudioSys.play('ui_ok'); return; }
    this.evaluate();
  }
  evaluate() {
    const r = this.w.evaluate();
    this.lastResult = r;
    if (r.ok) {
      AudioSys.play('correct');
      this.flashT = 0.4; this.flashCol = PAL.green;
      this.resultOk = true;
      const ch = this.ch;
      let xp = (10 + 8 * ch.difficulty) * (this.attempt === 1 ? 1 : 0.5) * Math.max(0.25, 1 - 0.25 * this.paidHints) * (this.o.isVariant ? 0.7 : 1) * (this.o.source === 'review' ? 1.25 : 1);
      this.xpGained = Math.round(xp);
      this.record(true);
      this.feedback = ch.explanation || '';
      this.voice = Voice.line('ok');
      this.misconception = null;
      this.lowConfNote = this.conf === 0;
    } else {
      AudioSys.play('wrong');
      this.shakeT = 0.35; this.flashT = 0.4; this.flashCol = PAL.red;
      this.resultOk = false;
      this.w.consequence && this.w.consequence(r);
      this.feedback = (this.w.feedback && this.w.feedback(r)) || this.ch.wrong || 'El resultado no coincide con lo que el sistema necesita.';
      this.voice = Voice.line('bad');
      this.misconception = this.conf === 2 && this.attempt === 1 ? (this.ch.misconception || 'Tenías mucha confianza en una respuesta incorrecta: es una señal de un concepto que conviene revisar con calma.') : null;
      if (this.attempt >= 2) this.record(false);
    }
    this.phase = 'result';
  }
  record(ok) {
    if (this.recorded) return;
    this.recorded = true;
    LearningModel.record({
      concept: this.ch.concept, chId: this.ch.id, correct: ok, firstTry: ok && this.attempt === 1,
      hints: this.paidHints, time: this.t, expected: this.ch.expected || EXPECTED_TIME[this.ch.type] || 40,
      conf: this.conf, difficulty: this.ch.difficulty, transfer: this.o.source === 'review' || this.o.transfer,
      guided: !!this.o.isVariant, misconception: this.conf === 2 && !(ok && this.attempt === 1), prompt: this.ch.prompt
    });
  }
  afterResult() {
    if (this.resultOk) {
      if (this.xpGained) Progression.addXP(this.xpGained, CONCEPTS[this.ch.concept]);
      this.finish({ ok: true, firstTry: this.attempt === 1, attempts: this.attempt, hints: this.paidHints, chId: this.ch.id });
      return;
    }
    if (this.attempt === 1) {
      this.attempt = 2;
      if (this.hintLevel < 1) { this.hintLevel = 1; this.hintText = (this.ch.hints || [])[0] || '¿Qué propiedad del sistema es la que realmente importa aquí?'; }
      this.w.reset();
      this.phase = 'play';
      return;
    }
    // Segundo fallo: ejemplo guiado
    this.phase = 'guided';
    this.w.showSolution();
    this.guidedText = (this.ch.explanation || '') + (this.o.isVariant ? '' : '  Ahora prueba uno parecido tú.');
  }
  afterGuided() {
    if (this.o.isVariant || this.o.noVariant) { this.finish({ ok: true, struggled: true, chId: this.ch.id }); return; }
    const v = QM.variantOf(this.ch);
    if (!v) { this.finish({ ok: true, struggled: true, chId: this.ch.id }); return; }
    const o = Object.assign({}, this.o, { isVariant: true, noConf: true });
    Game.pop();
    Game.push(new ChallengeState(v, o));
    UI.toast('NUEVO PROBLEMA SIMILAR', PAL.violet);
  }
  exitChallenge() {
    if (this.attempt >= 2 && !this.recorded) this.record(false);
    this.finish({ ok: false, exited: true, chId: this.ch.id });
  }
  finish(res) {
    if (Game.top() === this) Game.pop();
    if (this.o.onDone) this.o.onDone(res);
  }

  update(dt) {
    this.t += dt;
    this.shakeT = Math.max(0, this.shakeT - dt); this.flashT = Math.max(0, this.flashT - dt); this.msgT = Math.max(0, this.msgT - dt);
    if (this.phase === 'play') {
      if (Input.pressed('hint')) { this.useHint(); return; }
      if (Input.pressed('cancel') && this.o.allowExit !== false) { AudioSys.play('ui_back'); this.exitChallenge(); return; }
      if (Input.keyPressed('KeyV') && this.w.needsSubmit !== false) { this.submit(); return; }
      if (UI.clicked(this.hintBtn.x, this.hintBtn.y, this.hintBtn.w, this.hintBtn.h)) { this.useHint(); return; }
      this.w.update(dt);
    } else if (this.phase === 'conf') {
      if (Input.nav('left')) { this.confSel = (this.confSel + 2) % 3; AudioSys.play('ui_move'); }
      if (Input.nav('right')) { this.confSel = (this.confSel + 1) % 3; AudioSys.play('ui_move'); }
      const ci = this.confBtns.findIndex(b => UI.clicked(b.x, b.y, b.w, b.h));
      if (ci >= 0) { this.confSel = ci; this.conf = ci; this.evaluate(); return; }
      if (Input.pressed('confirm')) { this.conf = this.confSel; this.evaluate(); }
    } else if (this.phase === 'result') {
      const rb = this.resBtn;
      if (Input.pressed('confirm') || (rb && UI.clicked(rb.x, rb.y, rb.w, rb.h))) { AudioSys.play('ui_ok'); this.afterResult(); }
    } else if (this.phase === 'guided') {
      this.w.update(dt, true);
      const gb = this.guideBtn;
      if (Input.pressed('confirm') || (gb && UI.clicked(gb.x, gb.y, gb.w, gb.h))) { AudioSys.play('ui_ok'); this.afterGuided(); }
    }
  }

  render(g) {
    UI.overlayDim(g, 0.84);
    const ox = this.shakeT > 0 && !Settings.data.reduceShake ? Math.round(Math.sin(this.t * 80) * 3) : 0;
    g.save(); g.translate(ox, 0);
    const [src, scol] = SOURCE_TITLE[this.o.source || 'terminal'] || SOURCE_TITLE.terminal;
    UI.panel(g, 8, 8, 464, 256, { title: this.o.title || src, titleCol: scol });
    // cabecera
    const ch = this.ch;
    let x = 14;
    const cname = CONCEPTS[ch.concept] || ch.concept;
    const cw = Font.measure(cname) + 8;
    g.fillStyle = shade(PAL.cyan, 0.3); g.fillRect(x, 13, cw, 12);
    Font.draw(g, cname, x + 4, 13, PAL.cyan);
    x += cw + 6;
    Font.draw(g, ch.kind || TYPE_LABEL[ch.type] || '', x, 13, PAL.grayL);
    UI.pips(g, 330, 17, ch.difficulty, 5, PAL.amber);
    Font.draw(g, this.o.isVariant ? 'SIMILAR' : 'INTENTO ' + this.attempt, 362, 13, this.attempt > 1 ? PAL.amber : PAL.gray);
    // botón de pista
    this.hintBtn = { x: 420, y: 12, w: 46, h: 13 };
    const hb = this.hintBtn;
    g.fillStyle = UI.hover(hb.x, hb.y, hb.w, hb.h) ? '#2A2A12' : '#161A10'; g.fillRect(hb.x, hb.y, hb.w, hb.h);
    Font.draw(g, 'H ' + this.hintLevel + '/3', hb.x + hb.w / 2, hb.y, this.hintLevel >= 3 ? PAL.gray : PAL.amber, { align: 'center' });
    // enunciado
    Font.drawLines(g, this.promptLines.slice(0, 5), 16, 30, PAL.white, { hl: PAL.amber });
    // área del widget
    const a = this.area;
    const hintH = this.hintText && this.phase === 'play' ? 30 : 0;
    this.w.render(g, { x: a.x, y: a.y, w: a.w, h: a.h - hintH }, this.t);
    // pista
    if (hintH) {
      const hy = a.y + a.h - hintH + 2;
      g.fillStyle = '#16140A'; g.fillRect(14, hy, 452, hintH - 2);
      g.fillStyle = PAL.amber; g.fillRect(14, hy, 2, hintH - 2);
      const spk = Voice.speaker();
      g.drawImage(getPortrait(spk === 'TERMINAL' ? 'SYS' : spk, 'CURIOUS'), 18, hy + 2, 24, 24);
      const tag = Voice.hintTag();
      if (tag) { Font.draw(g, tag, 46, hy, PAL.violet); }
      Font.drawLines(g, UI.wrap(this.hintText, tag ? 356 : 410).slice(0, 2), tag ? 100 : 48, hy + 2, '#F5E3B8', { hl: PAL.white });
    }
    // pie
    if (this.phase === 'play') {
      const items = (this.w.keyHints ? this.w.keyHints() : [['↑↓', 'Mover'], ['E', 'Elegir']]).slice();
      if (this.w.needsSubmit !== false) items.push(['V', 'Verificar']);
      items.push(['H', 'Pista']);
      if (this.o.allowExit !== false) items.push(['ESC', 'Salir']);
      UI.keyHints(g, items, 240, 248, 'center');
    }
    if (this.msgT > 0) {
      const w = Font.measure(this.msg) + 12;
      g.fillStyle = 'rgba(40,10,14,0.95)'; g.fillRect(240 - w / 2, 226, w, 13);
      Font.draw(g, this.msg, 240, 226, PAL.amber, { align: 'center' });
    }
    g.restore();
    if (this.flashT > 0 && !Settings.data.reduceFlash) { g.globalAlpha = this.flashT * 0.4; g.fillStyle = this.flashCol; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
    if (this.phase === 'conf') this.renderConf(g);
    if (this.phase === 'result') this.renderResult(g);
    if (this.phase === 'guided') this.renderGuided(g);
  }
  renderConf(g) {
    UI.panel(g, 110, 90, 260, 76, { title: 'METACOGNICIÓN', titleCol: PAL.violet });
    Font.draw(g, '¿Qué tan seguro estás de tu respuesta?', 240, 100, PAL.white, { align: 'center' });
    const labels = ['POCO', 'MEDIO', 'MUCHO'];
    this.confBtns = [];
    for (let i = 0; i < 3; i++) {
      const bx = 128 + i * 78;
      UI.button(g, bx, 124, 70, 18, labels[i], this.confSel === i, { color: PAL.violet });
      this.confBtns.push({ x: bx, y: 124, w: 70, h: 18 });
    }
    Font.draw(g, 'No afecta al resultado: te ayuda a detectar ideas confusas.', 240, 148, PAL.gray, { align: 'center' });
  }
  renderResult(g) {
    const ok = this.resultOk;
    const spk = Voice.speaker();
    const blocks = [];
    const fbLines = UI.wrap(this.feedback || '', 330);
    const misLines = this.misconception ? UI.wrap(this.misconception, 330) : [];
    const lowLines = this.lowConfNote ? UI.wrap('Acertaste con poca confianza: vale la pena repasar por qué funciona.', 330) : [];
    const h = 60 + Math.min(7, fbLines.length) * 12 + (misLines.length ? misLines.length * 12 + 16 : 0) + (lowLines.length ? lowLines.length * 12 + 4 : 0);
    const y = Math.max(20, Math.floor((H - h) / 2));
    UI.panel(g, 50, y, 380, h, { border: ok ? PAL.green : PAL.red, title: ok ? '✓ CORRECTO' : '✗ AÚN NO', titleCol: ok ? PAL.green : PAL.red });
    g.drawImage(getPortrait(spk === 'TERMINAL' ? 'SYS' : spk, ok ? 'HAPPY' : 'WORRIED'), 58, y + 10);
    Font.draw(g, this.voice || '', 96, y + 10, ok ? PAL.green : PAL.amber);
    let ty = y + 26;
    Font.drawLines(g, fbLines.slice(0, 7), 96, ty, PAL.white, { hl: PAL.cyan });
    ty += Math.min(7, fbLines.length) * 12 + 4;
    if (lowLines.length) { Font.drawLines(g, lowLines, 96, ty, PAL.violet); ty += lowLines.length * 12 + 4; }
    if (misLines.length) {
      g.fillStyle = '#2A1030'; g.fillRect(92, ty, 330, misLines.length * 12 + 14);
      Font.draw(g, 'POSIBLE CONCEPTO ERRÓNEO', 96, ty, PAL.magenta);
      Font.drawLines(g, misLines, 96, ty + 12, '#F0D6F5');
      ty += misLines.length * 12 + 16;
    }
    const label = ok ? (this.xpGained ? 'CONTINUAR  +' + this.xpGained + ' XP' : 'CONTINUAR') : this.attempt === 1 ? 'REINTENTAR' : 'VER EJEMPLO GUIADO';
    UI.button(g, 240 - 80, y + h - 22, 160, 16, label, true, { color: ok ? PAL.green : PAL.amber });
    this.resBtn = { x: 160, y: y + h - 22, w: 160, h: 16 };
  }
  renderGuided(g) {
    const lines = UI.wrap(this.guidedText || '', 440);
    const h = 30 + Math.min(4, lines.length) * 12;
    UI.panel(g, 12, H - h - 8, 456, h, { border: PAL.violet, title: 'EJEMPLO GUIADO', titleCol: PAL.violet });
    Font.drawLines(g, lines.slice(0, 4), 20, H - h, PAL.white, { hl: PAL.cyan });
    UI.button(g, 330, H - 26, 130, 14, this.o.isVariant || this.o.noVariant ? 'CONTINUAR' : 'PROBLEMA SIMILAR', true, { color: PAL.violet });
    this.guideBtn = { x: 330, y: H - 26, w: 130, h: 14 };
  }
}

// Atajo para lanzar un desafío como tarea de script
function challengeTask(chOrId, o = {}) {
  const sig = Task.signal();
  let ch = typeof chOrId === 'string' ? QM.get(chOrId) : chOrId;
  if (!ch && o.concept) ch = QM.pick(o.concept);
  if (!ch) { sig.finish({ ok: true, missing: true }); return sig; }
  Game.push(new ChallengeState(ch, Object.assign({}, o, { onDone: r => { if (o.onDone) o.onDone(r); sig.finish(r); } })));
  return sig;
}


// ==================== 11_widgets.js ====================
// =============================================================================
// WIDGETS DE DESAFÍO — cada tipo implementa interacción, evaluación, pistas
// (resaltado / solución parcial), consecuencia visible y ejemplo guiado.
// =============================================================================
class Widget {
  constructor(ch, st) {
    this.ch = ch; this.st = st; this.d = ch.data || {};
    this.cur = 0; this.hl = false; this.sol = false; this.flash = 0; this.rects = []; this.vbtn = null; this.t = 0;
  }
  update(dt) { this.flash = Math.max(0, this.flash - dt); this.t += dt; }
  isReady() { return true; }
  highlight() { this.hl = true; }
  partial() {}
  showSolution() { this.sol = true; }
  reset() {}
  consequence() { this.flash = 1.2; }
  clickedRect() {
    for (const r of this.rects) if (UI.clicked(r.x, r.y, r.w, r.h)) return r;
    return null;
  }
  verifyClicked() { const b = this.vbtn; return b && UI.clicked(b.x, b.y, b.w, b.h); }
  drawVerify(g, x, y, focused) {
    this.vbtn = { x, y, w: 92, h: 14 };
    UI.button(g, x, y, 92, 14, 'VERIFICAR', focused, { color: PAL.green });
  }
  pulse() { return 0.5 + 0.5 * Math.sin(this.t * 6); }
}

// ---------------------------------------------------------------- visuales auxiliares ----
function renderVisual(g, d, a, t, hl) {
  const vis = Array.isArray(d.visual) ? d.visual : [d.visual];
  let y = a.y;
  const hlSet = new Set(hl || []);
  for (const v of vis) {
    if (v === 'meters' && d.meters) {
      const n = d.meters.length, cols = n > 4 ? 2 : 1, rows = Math.ceil(n / cols), cw = Math.floor(a.w / cols);
      d.meters.forEach((m, i) => {
        const cx = a.x + (i % cols) * cw, cy = y + Math.floor(i / cols) * 13;

class OrderWidget extends Widget {
  constructor(ch, st) {

    this.list = shuffleNotIdentity(this.items.map((_, i) => i));

  }

  update(dt, guided) {

    if (Input.nav('up')) {
      if (this.grab >= 0) { if (this.cur > this.locked) { this.swap(this.cur, this.cur - 1); this.cur--; this.grab = this.cur; } }
      else this.cur = (this.cur - 1 + n + 1) % (n + 1);

    }
    if (Input.nav('down')) {
      if (this.grab >= 0) { if (this.cur < n - 1) { this.swap(this.cur, this.cur + 1); this.cur++; this.grab = this.cur; } }
      else this.cur = (this.cur + 1) % (n + 1);
      AudioSys.play('ui_move');
    }
    if (this.verifyClicked()) { this.st.submit(); return; }
    const r = this.clickedRect();
    if (r) {
      if (r.i < this.locked) return;
      if (this.grab < 0) { this.grab = r.i; this.cur = r.i; }
      else if (this.grab === r.i) this.grab = -1;
      else { this.swap(this.grab, r.i); this.grab = -1; this.cur = r.i; }
      AudioSys.play('ui_ok');
      return;
    }
    if (Input.pressed('confirm')) {
      if (this.cur === n) { this.st.submit(); return; }
      if (this.cur < this.locked) return;
      this.grab = this.grab >= 0 ? -1 : this.cur;
      AudioSys.play('ui_ok');
    }
  }
  swap(i, j) { const t = this.list[i]; this.list[i] = this.list[j]; this.list[j] = t; this.wrongPos = null; }
  evaluate() {
    this.grab = -1;
    const wrong = this.list.map((v, i) => (v !== i ? i : -1)).filter(i => i >= 0);
    this.wrongPos = new Set(wrong);
    return { ok: wrong.length === 0, wrong };
  }
  feedback(r) {
    const base = r.wrong.length + ' de ' + this.list.length + ' pasos están fuera de lugar.';
    return this.ch.wrong ? base + ' ' + this.ch.wrong : base;
  }
  partial() {
    const k = Math.min(this.list.length - 1, Math.max(this.locked + 1, 2));
    const rest = this.list.filter(v => v >= k);
    this.list = [...Array(k).keys()].concat(shuffle(rest));
    this.locked = k; this.grab = -1; if (this.cur < k) this.cur = k;
  }
  showSolution() { this.sol = true; this.list = this.items.map((_, i) => i); this.wrongPos = null; }
  reset() { this.grab = -1; }
  render(g, a) {

      const it = this.items[v];
      const y = a.y + i * rh;
      const foc = this.cur === i && !this.sol;
      const grabbed = this.grab === i;
      let bc = foc ? PAL.cyan : PAL.panelB, bg = grabbed ? '#1D4A5E' : foc ? '#132E3C' : '#0D1C26';
      if (i < this.locked) { bc = PAL.green; bg = '#0E2418'; }
      if (this.wrongPos && this.wrongPos.has(i) && (this.flash > 0 || this.hl)) bc = this.hl && this.flash <= 0 ? PAL.amber : PAL.red;
      else if (this.hl && v !== i && !this.sol) bc = this.pulse() > 0.5 ? PAL.amber : bc;
      if (this.sol) { bc = PAL.green; }
      const bx = x + (grabbed ? 6 : 0);

      g.fillStyle = bc; g.fillRect(bx, y, 2, rh - 3); g.fillRect(bx, y + rh - 4, boxW, 1);
      Font.draw(g, (i + 1) + '.', a.x + 4, y + Math.floor((rh - 15) / 2), PAL.gray);

// ---------------------------------------------------------------- MATCH ----
const PAIR_COLS = ['#45E5FF', '#71FF9A', '#F1B45C', '#AA7DFF', '#FF8A3D', '#FF4FA3', '#E8F4F7', '#6E8BFF'];
class MatchWidget extends Widget {
  constructor(ch, st) {
    super(ch, st);
    this.pairs = this.d.pairs;
    const n = this.pairs.length;
    this.order = shuffleNotIdentity([...Array(n).keys()]); // posición derecha j muestra pairs[order[j]][1]
    this.map = new Array(n).fill(-1);
    this.side = 0; this.curR = 0; this.sel = -1; this.locked = new Set(); this.wrong = null;
  }
  keyHints() { return [['↑↓', 'Mover'], ['←→', 'Columna'], ['E', 'Unir']]; }
  pairUp(i, j) {
    if (this.locked.has(i)) return;
    for (let k = 0; k < this.map.length; k++) if (this.map[k] === j && !this.locked.has(k)) this.map[k] = -1;
    if ([...this.locked].some(k => this.map[k] === j)) return;
    this.map[i] = j; this.wrong = null;
    AudioSys.play('link');
  }
  update(dt, guided) {
    super.update(dt);
    if (guided) return;
    const n = this.pairs.length;
    if (this.verifyClicked()) { this.st.submit(); return; }
    const r = this.clickedRect();
    if (r) {
      if (r.side === 0) { if (!this.locked.has(r.i)) { this.sel = r.i; this.cur = r.i; this.side = 1; } }
      else if (this.sel >= 0) { this.pairUp(this.sel, r.i); this.sel = -1; this.side = 0; }
      return;
    }
    if (Input.nav('left')) { this.side = 0; AudioSys.play('ui_move'); }
    if (Input.nav('right') && this.cur < n) { this.side = 1; AudioSys.play('ui_move'); }
    if (Input.nav('up')) { if (this.side === 0) this.cur = (this.cur - 1 + n + 1) % (n + 1); else this.curR = (this.curR - 1 + n) % n; AudioSys.play('ui_move'); }
    if (Input.nav('down')) { if (this.side === 0) this.cur = (this.cur + 1) % (n + 1); else this.curR = (this.curR + 1) % n; AudioSys.play('ui_move'); }
    if (Input.pressed('confirm')) {
      if (this.side === 0) {
        if (this.cur === n) { this.st.submit(); return; }
        if (this.locked.has(this.cur)) return;
        this.sel = this.cur; this.side = 1; AudioSys.play('ui_ok');
      } else {
        if (this.sel < 0) this.sel = this.cur;
        this.pairUp(this.sel, this.curR);
        this.sel = -1; this.side = 0;
        const next = this.map.findIndex((m, k) => m < 0 && !this.locked.has(k));
        this.cur = next >= 0 ? next : n;
      }
    }
  }
  isReady() { return this.map.every(m => m >= 0); }
  get notReadyMsg() { return 'Une cada elemento de la izquierda con uno de la derecha.'; }
  evaluate() {
    const wrong = this.map.map((j, i) => (this.order[j] !== i ? i : -1)).filter(i => i >= 0);
    this.wrong = new Set(wrong);
    return { ok: wrong.length === 0, wrong };
  }
  feedback(r) { return r.wrong.length + ' conexiones no corresponden. ' + (this.ch.wrong || ''); }
  correctJ(i) { return this.order.indexOf(i); }
  highlight() { this.hl = true; }
  partial() {
    const n = this.pairs.length;
    const cand = [...Array(n).keys()].filter(i => !this.locked.has(i) && this.map[i] !== this.correctJ(i));
    shuffle(cand).slice(0, Math.max(1, Math.floor(n / 2))).forEach(i => {
      const j = this.correctJ(i);
      for (let k = 0; k < n; k++) if (this.map[k] === j) this.map[k] = -1;
      this.map[i] = j; this.locked.add(i);
    });
  }
  showSolution() { this.sol = true; this.map = this.pairs.map((_, i) => this.correctJ(i)); this.wrong = null; }
  reset() { this.sel = -1; this.side = 0; }
  render(g, a) {
    this.rects = [];
    const n = this.pairs.length;
    const rh = clamp(Math.floor((a.h - 20) / n), 13, 26);
    const lw = Math.floor(a.w * 0.40), rx = a.x + Math.floor(a.w * 0.55), rw = a.w - (rx - a.x);
    const hlI = this.hl ? this.map.findIndex((m, i) => m !== this.correctJ(i)) : -1;
    for (let i = 0; i < n; i++) {
      const y = a.y + i * rh;
      const foc = this.side === 0 && this.cur === i && !this.sol;
      const col = this.map[i] >= 0 ? PAIR_COLS[i % PAIR_COLS.length] : PAL.panelB;
      let bc = foc || this.sel === i ? PAL.cyan : col;
      if (this.wrong && this.wrong.has(i) && this.flash > 0) bc = PAL.red;
      if (this.locked.has(i)) bc = PAL.green;
      g.fillStyle = this.sel === i ? '#1D4A5E' : '#0D1C26'; g.fillRect(a.x, y, lw, rh - 3);
      g.fillStyle = bc; g.fillRect(a.x, y, 2, rh - 3);
      const ll = UI.wrap(this.pairs[i][0], lw - 10);
      Font.drawLines(g, ll.slice(0, rh > 22 ? 2 : 1), a.x + 6, y + (ll.length > 1 && rh > 22 ? 0 : Math.floor((rh - 15) / 2)), PAL.white);
      this.rects.push({ x: a.x, y, w: lw, h: rh - 3, i, side: 0 });
      // derecha
      const j = i;
      const txt = this.pairs[this.order[j]][1];
      const focR = this.side === 1 && this.curR === j && !this.sol;
      const owner = this.map.indexOf(j);

      if (hlI >= 0 && this.correctJ(hlI) === j) rc = this.pulse() > 0.5 ? PAL.amber : rc;
      g.fillStyle = focR ? '#132E3C' : '#0D1C26'; g.fillRect(rx, y, rw, rh - 3);
      g.fillStyle = rc; g.fillRect(rx + rw - 2, y, 2, rh - 3);
      const rl = UI.wrap(txt, rw - 10);
      Font.drawLines(g, rl.slice(0, rh > 22 ? 2 : 1), rx + 5, y + (rl.length > 1 && rh > 22 ? 0 : Math.floor((rh - 15) / 2)), PAL.grayL);
      this.rects.push({ x: rx, y, w: rw, h: rh - 3, i: j, side: 1 });
    }
    if (hlI >= 0) { const y = a.y + hlI * rh; g.fillStyle = this.pulse() > 0.5 ? PAL.amber : PAL.panelB; g.fillRect(a.x + lw - 3, y, 3, rh - 3); }
    // líneas
    for (let i = 0; i < n; i++) {
      const j = this.map[i]; if (j < 0) continue;
      const y1 = a.y + i * rh + Math.floor(rh / 2) - 2, y2 = a.y + j * rh + Math.floor(rh / 2) - 2;
      const x1 = a.x + lw, x2 = rx;
      let col = PAIR_COLS[i % PAIR_COLS.length];
      if (this.wrong && this.wrong.has(i) && this.flash > 0) col = PAL.red;
      if (this.sol) col = PAL.green;
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
      g.fillStyle = col;
      for (let s = 0; s <= steps; s += 2) g.fillRect(Math.round(lerp(x1, x2, s / steps)), Math.round(lerp(y1, y2, s / steps)), 1, 1);
    }
    if (!this.sol) this.drawVerify(g, a.x, a.y + a.h - 16, this.side === 0 && this.cur === n);
  }
}

    }
  }
}

// ---------------------------------------------------------------- SIM (parámetros y compromisos) ----
class SimWidget extends Widget {
  constructor(ch, st) {
    super(ch, st);

    if (this.locked.has(pr.k)) return;

    if (nv !== this.p[pr.k]) { this.p[pr.k] = nv; this.out = this.d.compute(this.p); this.failing = null; AudioSys.play('tick'); if (this.d.onChange) this.d.onChange(this.p, this.out); }
  }
  update(dt, guided) {
    super.update(dt);
    if (guided) return;
    const n = this.d.params.length;
    if (this.verifyClicked()) { this.st.submit(); return; }
    const r = this.clickedRect();
    if (r) {
      const pr = this.d.params[r.i];
      this.cur = r.i;
      if (!this.locked.has(pr.k)) {
        const f = clamp((Input.pointer.x - r.x) / r.w, 0, 1);
        const v = pr.min + Math.round(f * (pr.max - pr.min) / pr.step) * pr.step;
        this.p[pr.k] = clamp(Math.round(v * 1000) / 1000, pr.min, pr.max); this.out = this.d.compute(this.p); this.failing = null; AudioSys.play('tick');
        if (this.d.onChange) this.d.onChange(this.p, this.out);

    }

    if (Input.nav('down')) { this.cur = (this.cur + 1) % (n + 1); AudioSys.play('ui_move'); }

      if (Input.nav('right')) this.adjust(pr, 1);

  }

      g.fillStyle = lock ? PAL.green : hlp.has(pr.k) && this.pulse() > 0.5 ? PAL.amber : foc ? PAL.cyan : PAL.panelB; g.fillRect(a.x, y, 2, 24);

// ---------------------------------------------------------------- INTERRUPTS ----
const IRQ_STEPS = ['GUARDAR ESTADO', 'EJECUTAR ISR', 'RESTAURAR ESTADO', 'CONTINUAR PROCESO'];
const PRIO_NAME = { 1: 'ALTA', 2: 'MEDIA', 3: 'BAJA' };
const PRIO_COL = { 1: PAL.red, 2: PAL.amber, 3: PAL.green };
class InterruptWidget extends Widget {
  constructor(ch, st) {
    super(ch, st);
    this.needsSubmit = false;

    this.setup();
  }
  setup() {
    this.time = 0; this.progress = 0; this.events = this.d.events.map(e => Object.assign({ done: false, arrived: false }, e));

    this.selDev = 0; this.cur = 0; this.finished = false; this.hlStep = false;
  }
  keyHints() { return this.stage === 'select' ? [['←→', 'Dispositivo'], ['E', 'Atender']] : [['↑↓', 'Paso'], ['E', 'Ejecutar']]; }
